<script>
/* direct cloud sync (case A): push this drill's own progress to rooms/<room>/appstats */
window.QB_APP='vocab';
(function(){
  window.qbSyncKick=function(){};
  var creds=null;try{creds=JSON.parse(localStorage.getItem('qb_sync')||'null');}catch(e){}
  if(!creds||!creds.fb||!creds.fb.databaseURL||!creds.room||!window.firebase)return;
  var db,base;
  try{if(!firebase.apps.length)firebase.initializeApp(creds.fb);db=firebase.database();base='rooms/'+creds.room+'/appstats';}catch(e){return;}
  function num(x){x=+x;return isFinite(x)?x:0;}
  function dnum(d){if(!d)return 0;var p=(''+d).split('-');return num(p[0])*10000+num(p[1])*100+num(p[2]);}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function role(){try{return localStorage.getItem('qb_calc_owner')==='papa'?'papa':'child';}catch(e){return 'child';}}
  function pushVocab(key){var ls=lsGet(key+'_stats');if(!ls)return;
    try{db.ref(base+'/'+key).transaction(function(cur){
      if(!cur)return ls;
      if(num(ls.learned)>num(cur.learned))return ls;
      if(num(ls.learned)===num(cur.learned)&&num(ls.updated)>=num(cur.updated))return ls;
      return cur;
    },function(){},false);}catch(e){}}
  function pushKeisan(){var ls=lsGet('keisan_stats');if(!ls)return;var r=role();
    try{db.ref(base+'/'+r).transaction(function(cur){
      cur=cur||{};var del=cur.del||{},ck=cur.keisan||{},best={},k,cb=ck.best||{},lb=ls.best||{};
      for(k in cb)best[k]=cb[k];
      for(k in lb)best[k]=(best[k]==null)?lb[k]:Math.min(best[k],lb[k]);
      var dc=dnum(ck.date),dl=dnum(ls.date),m={best:best};
      if(dc===dl){m.date=ck.date||ls.date;m.today=Math.max(num(ck.today),num(ls.today));m.lastAcc=Math.max(num(ck.lastAcc),num(ls.lastAcc));}
      else if(dc>dl){m.date=ck.date;m.today=num(ck.today);m.lastAcc=ck.lastAcc;}
      else{m.date=ls.date;m.today=num(ls.today);m.lastAcc=ls.lastAcc;}
      m.ts=Math.max(num(ck.ts),num(ls.ts));
      var fb={};for(k in m.best){if(del[k]!=null&&m.best[k]===del[k])continue;fb[k]=m.best[k];}m.best=fb;
      cur.keisan=m;return cur;
    },function(){},false);}catch(e){}}
  function doPush(){if(window.QB_APP==='keisan')pushKeisan();else pushVocab(window.QB_APP);}
  var t=null;
  window.qbSyncKick=function(){clearTimeout(t);t=setTimeout(doPush,700);};
  document.addEventListener('visibilitychange',function(){if(document.hidden)doPush();});
  window.addEventListener('pagehide',doPush);
  doPush();
})();
</script>
<style>

      --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
      --warm:#f3b05f; --warm-soft:#33291a;
      --good:#6fcf90; --good-soft:#1e3326;
      --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#14171d; --card:#1f232c; --card2:#262b35;
    --ink:#eef1f6; --ink-soft:#b9c0cc; --ink-faint:#8a93a2;
    --line:#333945; --line2:#3e4552;
    --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
    --warm:#f3b05f; --warm-soft:#33291a;
    --good:#6fcf90; --good-soft:#1e3326;
    --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding-block:20px 30px;padding-left:18px;padding-right:18px;min-height:100%;display:flex;flex-direction:column}
  .toboard{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-family:var(--jp);font-weight:800;font-size:13px;color:var(--accent-d);background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:var(--shadow);margin-bottom:4px}

  h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:2px 0 0;color:var(--ink)}
  .bar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4));width:0%;transition:width .4s}

  /* home: stage list — cards sized to content, bigger text (NOT stretched) */
  .stages{display:grid;gap:12px;margin:14px 0}

  .sc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

  .sc-fill{height:100%;background:var(--sc);width:0%;transition:width .4s}
  .sc-clear{font-size:13px;color:var(--good);font-weight:800}
  .home-tip{text-align:center;font-size:13.5px;color:var(--ink-faint);margin-top:18px;line-height:1.6}

  /* study */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}

  .study-name{font-family:var(--jp)!important}
  .back:active{transform:translateY(1px)}
  .study-name{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
  .study-stars{font-size:12px;color:var(--sc);font-weight:800;margin-left:auto}
  .prog{margin:10px 0 6px;display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;color:var(--ink-soft);font-weight:700}
  .prog .bar{max-width:220px}
  .prog .fill{background:var(--sc)}

  #study{flex:1;display:flex;flex-direction:column;min-height:0}
  .studymid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
  .card3d{width:100%;height:clamp(360px,56vh,520px);display:flex;flex-direction:column}
  .inner{position:relative;width:100%;flex:1;cursor:pointer}
  .face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;overflow:hidden;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
  .face::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:var(--sc)}
  .back{background:var(--card2)}
  .front{justify-content:center;gap:clamp(16px,3.6vh,38px)}
  /* front shown by default; flip swaps to back. Hidden face gets pointer-events:none so taps always hit the visible face's buttons. */
  .inner .front{opacity:1;pointer-events:auto;transform:scale(1)}
  .inner.flip .front{opacity:0;pointer-events:none;transform:scale(.97)}
  .inner.flip .back{opacity:1;pointer-events:auto;transform:scale(1)}
  .emoji{font-size:clamp(96px,16vh,176px);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
  .word{font-family:var(--disp);font-weight:700;font-size:clamp(40px,12vw,62px);color:var(--ink);line-height:1.1;max-width:100%;overflow-wrap:anywhere;padding:0 6px}
  .pos{margin-top:4px;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sc);background:var(--accent-soft);padding:6px 16px;border-radius:999px;display:inline-block}
  .tiphint{font-size:15px;color:var(--ink-faint);font-weight:700}
  .listen{position:absolute;top:14px;right:14px;border:none;background:var(--accent-soft);color:var(--accent-d);width:52px;height:52px;border-radius:50%;font-size:23px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .listen:active{transform:scale(.92)}
  .b-label{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .b-word{font-family:var(--disp);font-weight:700;font-size:clamp(26px,7.6vw,34px);color:var(--sc);margin-bottom:16px}
  .def{font-size:clamp(22px,6.2vw,30px);line-height:1.45;color:var(--ink);font-weight:700;max-width:28ch}
  .ex{margin-top:18px;font-size:clamp(17px,4.8vw,21px);line-height:1.55;color:var(--ink-soft);font-style:italic;max-width:32ch}
  .ex b{color:var(--warm);font-style:normal;font-weight:800}
  .jp{margin-top:16px}
  .jp button{border:1px dashed var(--line2);background:transparent;color:var(--ink-faint);font-family:var(--jp);font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 14px;cursor:pointer}
  .jp .word-jp{font-family:var(--jp);font-weight:700;color:var(--ink-soft);font-size:15px}

  .controls{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px}
  .nav{border:1px solid var(--line2);background:var(--card);color:var(--ink);width:54px;height:54px;border-radius:16px;font-size:22px;cursor:pointer;box-shadow:var(--shadow);font-weight:800}
  .nav:active{transform:translateY(2px)}
  .know{flex:1;max-width:220px;border:none;border-radius:16px;padding:16px;font-family:var(--body);font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow);background:var(--sc);color:#fff}
  .know.on{background:var(--good)}
  .know:active{transform:translateY(2px)}
  .row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .mini{border:1px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:12px;padding:9px 14px;font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer}
  .mini:active{transform:translateY(1px)}
  .hint-line{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:12px;line-height:1.6}
  .done-msg{text-align:center;background:var(--good-soft);border:1px solid var(--good);border-radius:16px;padding:14px;color:var(--good);font-weight:800;margin-top:12px}
  @media (max-width:380px){.emoji{font-size:clamp(54px,9vh,80px)}}
</style>

<script>
const STAGES=[
 {name:"ステージ1 スタート",sub:"準1級 基礎（よく出る語）",stars:2,color:"var(--s1)",words:[
  {w:"accomplish",pos:"verb",e:"✅",def:"to finish something hard successfully",ex:"She <b>accomplished</b> her big goal.",jp:"成しとげる"},

  {w:"describe",pos:"verb",e:"🗒️",def:"to say what something is like",ex:"Please <b>describe</b> the man.",jp:"描写する"},
  {w:"efficient",pos:"adj",e:"⚙️",def:"working well without wasting time",ex:"This is an <b>efficient</b> machine.",jp:"効率的な"},
  {w:"encourage",pos:"verb",e:"💪",def:"to give someone hope or courage",ex:"She <b>encouraged</b> me to try.",jp:"励ます"},
  {w:"estimate",pos:"verb",e:"🔢",def:"to guess the size or amount",ex:"He <b>estimated</b> the cost.",jp:"見積もる"},

const TOTAL=STAGES.reduce(function(n,s){return n+s.words.length;},0);
const GOAL=1900;
var known=loadKnown();
var si=0, order=[], idx=0, flipped=false, filterOn=false;

function loadKnown(){try{return JSON.parse(localStorage.getItem('vocab_known')||'{}')||{};}catch(e){return {};}}
function learnedCount(){return STAGES.reduce(function(n,s){return n+stageKnown(s);},0);}
function writeStats(){try{var o={};try{o=JSON.parse(localStorage.getItem('vocab_stats')||'{}')||{};}catch(_){}o.learned=learnedCount();o.deckSize=TOTAL;o.goal=GOAL;o.updated=Date.now();localStorage.setItem('vocab_stats',JSON.stringify(o));}catch(e){}}
function saveKnown(){try{localStorage.setItem('vocab_known',JSON.stringify(known));}catch(e){}writeStats();try{var o=JSON.parse(localStorage.getItem('vocab_stats')||'{}');o.studiedAt=Date.now();localStorage.setItem('vocab_stats',JSON.stringify(o));}catch(e){}if(window.qbSyncKick)qbSyncKick();}
function stageKnown(s){return s.words.filter(function(c){return known[c.w];}).length;}

function renderHome(){
  var kc=learnedCount();
  document.getElementById('ovCount').textContent=kc;
  document.getElementById('ovFill').style.width=Math.min(100,kc/GOAL*100)+'%';
  document.getElementById('ovPct').textContent=Math.round(kc/GOAL*100)+'%';
  document.getElementById('ovDeck').textContent=TOTAL;
  writeStats();
  var html=STAGES.map(function(s,i){
    var k=stageKnown(s), t=s.words.length, pct=Math.round(k/t*100), clear=(k===t);
    var stars='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
    return '<button class="stage-card" style="--sc:'+s.color+'" onclick="openStage('+i+')">'
      +'<div class="sc-top"><span class="sc-name">'+s.name+'</span><span class="sc-stars">'+stars+'</span></div>'
      +'<div class="sc-sub">'+s.sub+' ・ '+t+'語</div>'
      +'<div class="sc-prog"><span>覚えた '+k+' / '+t+'</span><div class="sc-bar"><div class="sc-fill" style="width:'+pct+'%"></div></div>'
      +(clear?'<span class="sc-clear">クリア！⭐</span>':'<span>'+pct+'%</span>')+'</div>'
      +'</button>';
  }).join('');
  document.getElementById('stageList').innerHTML=html;
}

function openStage(i){si=i;order=STAGES[i].words.map(function(_,n){return n;});idx=0;filterOn=false;
  document.getElementById('home').hidden=true;document.getElementById('study').hidden=false;
  var s=STAGES[i];document.getElementById('study').style.setProperty('--sc',s.color);
  document.getElementById('studyName').textContent=s.name;
  document.getElementById('studyStars').textContent='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
  render();window.scrollTo(0,0);
}
function showHome(){document.getElementById('study').hidden=true;document.getElementById('home').hidden=false;renderHome();window.scrollTo(0,0);}

function activeOrder(){if(!filterOn)return order;var w=STAGES[si].words;var f=order.filter(function(n){return !known[w[n].w];});return f.length?f:order;}
function curCard(){var o=activeOrder();if(idx>=o.length)idx=0;return STAGES[si].words[o[idx]];}

function render(){
  var w=STAGES[si].words,o=activeOrder();if(idx>=o.length)idx=o.length-1;if(idx<0)idx=0;
  var c=w[o[idx]];
  flipped=false;document.getElementById('inner').classList.remove('flip');
  document.getElementById('fEmoji').textContent=c.e;
  document.getElementById('fWord').textContent=c.w;
  document.getElementById('fPos').textContent=c.pos;
  document.getElementById('bWord').textContent=c.w;
  document.getElementById('bDef').textContent=c.def;
  document.getElementById('bEx').innerHTML=c.ex;
  document.getElementById('jpBtn').outerHTML='<button id="jpBtn" onclick="toggleJp(event)">日本語でヒント</button>';
  document.getElementById('posLabel').textContent=(idx+1)+' / '+o.length;
  var k=stageKnown(STAGES[si]);
  document.getElementById('knownLabel').textContent='覚えた '+k;
  document.getElementById('fill').style.width=(k/w.length*100)+'%';
  var kb=document.getElementById('knowBtn');
  if(known[c.w]){kb.classList.add('on');kb.textContent='✓ 覚えた！';}else{kb.classList.remove('on');kb.textContent='覚えた！';}
  document.getElementById('filterBtn').style.outline=filterOn?'2px solid '+STAGES[si].color:'none';
}
function flip(){flipped=!flipped;document.getElementById('inner').classList.toggle('flip',flipped);}
function next(){var o=activeOrder();idx=(idx+1)%o.length;render();}
function prev(){var o=activeOrder();idx=(idx-1+o.length)%o.length;render();}
function toggleKnow(){var c=curCard();known[c.w]=!known[c.w];saveKnown();
  var allNow=STAGES[si].words.every(function(d){return known[d.w];});
  render();if(allNow)setTimeout(function(){showDone(STAGES[si].name);},250);}
function toggleFilter(){filterOn=!filterOn;idx=0;render();}
function shuffle(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}idx=0;render();}
function toggleJp(ev){ev.stopPropagation();var c=curCard();document.getElementById('jpBtn').outerHTML='<span class="word-jp" id="jpBtn">🇯🇵 '+c.jp+'</span>';}
var enVoice=null;
function pickVoice(){try{if(!('speechSynthesis'in window))return;var vs=window.speechSynthesis.getVoices()||[];if(!vs.length)return;
  enVoice=vs.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]
    ||vs.filter(function(v){return /^en/i.test(v.lang);})[0]
    ||enVoice;}catch(e){}}
try{if('speechSynthesis'in window){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function speakWord(ev){if(ev){ev.stopPropagation();}var c=curCard();
  try{
    if(!('speechSynthesis'in window)){alert('この端末は音声読み上げに対応していません');return;}
    var ss=window.speechSynthesis;ss.cancel();if(ss.paused){try{ss.resume();}catch(e){}}
    if(!enVoice)pickVoice();
    var u=new SpeechSynthesisUtterance(c.w);u.lang='en-US';u.rate=.85;u.pitch=1;
    if(enVoice)u.voice=enVoice;
    ss.speak(u);
    // some mobile engines stall right after load; nudge with a resume on next tick
    setTimeout(function(){try{if(ss.paused)ss.resume();}catch(e){}},80);
  }catch(e){}}
function showDone(name){var st=document.getElementById('study');if(document.getElementById('doneMsg'))return;var d=document.createElement('div');d.className='done-msg';d.id='doneMsg';d.textContent='🎉 '+name+' クリア！全部覚えたね！';st.insertBefore(d,st.querySelector('.card3d'));setTimeout(function(){if(d)d.remove();},4000);}

renderHome();
</script>
