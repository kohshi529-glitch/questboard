<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中学入試 語彙クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* direct cloud sync (case A): push this drill's own progress to rooms/<room>/appstats */
window.QB_APP='jvocab';
(function(){
  window.qbSyncKick=function(){};
  /* 覚えた語リスト本体：{語: 時刻}（正=覚えた・負=取り消し）。語ごとに新しい操作が勝つ */
  window.qbKMerge=function(a,b){var o={},w;a=a||{};b=b||{};for(w in a)o[w]=a[w];for(w in b){if(o[w]==null||Math.abs(b[w])>Math.abs(o[w]))o[w]=b[w];}return o;};
  window.qbKEnsure=function(key){var k=null;try{k=JSON.parse(localStorage.getItem(key+'_kts')||'null');}catch(e){}if(k)return k;
    var old={};try{old=JSON.parse(localStorage.getItem(key+'_known')||'{}')||{};}catch(e){}var o={},w;for(w in old){if(old[w])o[w]=1;}
    try{localStorage.setItem(key+'_kts',JSON.stringify(o));}catch(e){}return o;};
  var creds=null;try{creds=JSON.parse(localStorage.getItem('qb_sync')||'null');}catch(e){}
  if(!creds||!creds.fb||!creds.fb.databaseURL||!creds.room||!window.firebase)return;
  var db,base;
  try{if(!firebase.apps.length)firebase.initializeApp(creds.fb);db=firebase.database();base='rooms/'+creds.room+'/appstats';}catch(e){return;}
  function num(x){x=+x;return isFinite(x)?x:0;}
  function dnum(d){if(!d)return 0;var p=(''+d).split('-');return num(p[0])*10000+num(p[1])*100+num(p[2]);}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function role(){try{return localStorage.getItem('qb_calc_owner')==='papa'?'papa':'child';}catch(e){return 'child';}}
  function pushVocab(key){var ls=lsGet(key+'_stats');if(!ls)return;
    try{db.ref(base+'/'+key).transaction(function(cur){
      if(!cur)return ls;
      var w=cur;
      if(num(ls.learned)>num(cur.learned))w=ls;
      else if(num(ls.learned)===num(cur.learned)&&num(ls.updated)>=num(cur.updated))w=ls;
      var qa=num(ls.quiz&&ls.quiz.updated),qb=num(cur.quiz&&cur.quiz.updated),q=(qa>=qb)?ls.quiz:cur.quiz; /* 検問記録は新しい方を残す */
      if(q&&w.quiz!==q){w=JSON.parse(JSON.stringify(w));w.quiz=q;}
      var nw=(num(ls.updated)>=num(cur.updated))?ls:cur; /* 収録語数・目標は、いちばん新しく書いた端末（＝今のアプリ）の値を使う */
      if(w!==nw&&(w.deckSize!==nw.deckSize||w.goal!==nw.goal)){w=JSON.parse(JSON.stringify(w));if(nw.deckSize!=null)w.deckSize=nw.deckSize;if(nw.goal!=null)w.goal=nw.goal;}
      var dm=mergeQDays(ls.quiz&&ls.quiz.days,cur.quiz&&cur.quiz.days);
      if(dm&&w.quiz&&JSON.stringify(dm)!==JSON.stringify(w.quiz.days||null)){w=JSON.parse(JSON.stringify(w));w.quiz.days=dm;}
      return w;
    },function(){},false);}catch(e){}}
  function pushKeisan(){var ls=lsGet('keisan_stats');if(!ls)return;var r=role();
    try{db.ref(base+'/'+r).transaction(function(cur){
      cur=cur||{};var del=cur.del||{},ck=cur.keisan||{},best={},k,cb=ck.best||{},lb=ls.best||{};
      for(k in cb)best[k]=cb[k];
      for(k in lb)best[k]=(best[k]==null)?lb[k]:Math.min(best[k],lb[k]);
      var dc=dnum(ck.date),dl=dnum(ls.date),m={best:best};
      if(dc===dl){m.date=ck.date||ls.date;m.today=Math.max(num(ck.today),num(ls.today));m.lastAcc=Math.max(num(ck.lastAcc),num(ls.lastAcc));}
      else if(dc>dl){m.date=ck.date;m.today=num(ck.today);m.lastAcc=ck.lastAcc;}
      else{m.date=ls.date;m.today=num(ls.today);m.lastAcc=ls.lastAcc;}
      m.ts=Math.max(num(ck.ts),num(ls.ts));
      var fb={};for(k in m.best){if(del[k]!=null&&m.best[k]===del[k])continue;fb[k]=m.best[k];}m.best=fb;
      cur.keisan=m;return cur;
    },function(){},false);}catch(e){}}
  /* がんばり記録：検問の日ごとの記録 days={日付:{t:受けた回数,p:満点,b:最高%}}（項目ごとに大きい方） */
  function mergeQDays(a,b){if(!a&&!b)return null;var o={},d,f;a=a||{};b=b||{};
    for(d in a)o[d]=a[d];for(d in b){if(!o[d]){o[d]=b[d];continue;}var x=o[d]||{},y=b[d]||{},z={};for(f in x)z[f]=num(x[f]);for(f in y)z[f]=Math.max(num(z[f]),num(y[f]));o[d]=z;}
    var ks=Object.keys(o).sort(function(p,q){return dnum(p)-dnum(q);});while(ks.length>400)delete o[ks.shift()];return o;}
  /* 収録語リスト（版 v つき）。新しい版だけがサーバの値を置きかえる */
  function pushDeck(key){var d=null;try{d=localStorage.getItem(key+'_deck');}catch(e){}if(!d)return;var dv;try{dv=JSON.parse(d);}catch(e){return;}
    try{if(localStorage.getItem(key+'_deckSent')===d)return;}catch(e){}
    try{db.ref(base+'/'+key+'_deck').transaction(function(cur){var c=null;if(typeof cur==='string'){try{c=JSON.parse(cur);}catch(e){}}if(c&&num(c.v)>=num(dv.v))return;return d;},function(err){if(!err){try{localStorage.setItem(key+'_deckSent',d);}catch(e){}}},false);}catch(e){}}
  function pushKnown(key){var loc=window.qbKEnsure(key);
    try{db.ref(base+'/'+key+'_k').transaction(function(cur){
      var c={};if(typeof cur==='string'){try{c=JSON.parse(cur)||{};}catch(e){}}
      var s=JSON.stringify(window.qbKMerge(c,loc));return (s===cur)?undefined:s;
    },function(err,committed,snap){if(err||!snap)return;var v=snap.val();if(typeof v!=='string')return;var r;try{r=JSON.parse(v)||{};}catch(e){return;}
      var now=window.qbKEnsure(key),m=window.qbKMerge(now,r);
      if(JSON.stringify(m)!==JSON.stringify(now)){try{localStorage.setItem(key+'_kts',JSON.stringify(m));}catch(e){}if(window.qbOnKnownSync)window.qbOnKnownSync();}
    },false);}catch(e){}}
  function doPush(){if(window.QB_APP==='keisan')pushKeisan();else{pushKnown(window.QB_APP);pushVocab(window.QB_APP);pushDeck(window.QB_APP);}}
  var t=null;
  window.qbSyncKick=function(){clearTimeout(t);t=setTimeout(doPush,700);};
  document.addEventListener('visibilitychange',function(){if(document.hidden)doPush();});
  window.addEventListener('pagehide',doPush);
  doPush();
})();
</script>
<style>
  :root{
    --bg:#f4f1e8; --card:#ffffff; --card2:#fbf9f3;
    --ink:#283042; --ink-soft:#5a6475; --ink-faint:#8b94a4;
    --line:#e6e1d4; --line2:#d8d2c2;
    --accent:#1f9e8e; --accent-d:#17867a; --accent-soft:#e3f4f1;
    --warm:#f4a23b; --warm-soft:#fcecd6;
    --good:#2f9e5e; --good-soft:#e4f3e9;
    --s1:#2f9e5e; --s2:#1f9e8e; --s3:#e0892a; --s4:#d6504e;
    --shadow:0 2px 4px rgba(40,48,66,.06),0 10px 26px rgba(40,48,66,.10);
    --disp:"Fredoka","Nunito",system-ui,sans-serif;
    --body:"Nunito",system-ui,-apple-system,sans-serif;
    --jp:"Noto Sans JP",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#14171d; --card:#1f232c; --card2:#262b35;
      --ink:#eef1f6; --ink-soft:#b9c0cc; --ink-faint:#8a93a2;
      --line:#333945; --line2:#3e4552;
      --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
      --warm:#f3b05f; --warm-soft:#33291a;
      --good:#6fcf90; --good-soft:#1e3326;
      --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#14171d; --card:#1f232c; --card2:#262b35;
    --ink:#eef1f6; --ink-soft:#b9c0cc; --ink-faint:#8a93a2;
    --line:#333945; --line2:#3e4552;
    --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
    --warm:#f3b05f; --warm-soft:#33291a;
    --good:#6fcf90; --good-soft:#1e3326;
    --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding-block:20px 30px;padding-left:18px;padding-right:18px;min-height:100%;display:flex;flex-direction:column}
  .toboard{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-family:var(--jp);font-weight:800;font-size:13px;color:var(--accent-d);background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:var(--shadow);margin-bottom:4px}
  .toboard:active{transform:translateY(1px)}
  #home{flex:1;display:flex;flex-direction:column}
  header{text-align:center;margin-bottom:8px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:800;margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:2px 0 0;color:var(--ink)}
  .bar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4));width:0%;transition:width .4s}
  .goalbox{margin:14px auto 20px;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);padding:16px 18px}
  .goal-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .goal-top .goal-v{color:var(--accent-d)}
  .goal-main{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--ink);margin:6px 0 10px}
  .goal-main .goal-unit{font-size:15px;color:var(--ink-faint);font-weight:700}
  .goalbox .bar{height:11px;margin:0}
  .goal-sub{margin-top:8px;font-size:12px;color:var(--ink-faint);font-weight:700}

  /* home: stage list — cards sized to content, bigger text (NOT stretched) */
  .stages{display:grid;gap:12px;margin:14px 0}
  .stage-card{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--sc);border-radius:18px;
    box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;display:block;width:100%;text-align:left;font-family:var(--body)}
  .stage-card:active{transform:translateY(1px)}
  .sc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sc-name{font-family:var(--disp);font-weight:700;font-size:21px;color:var(--ink)}
  .sc-stars{font-size:15px;color:var(--sc);font-weight:800;letter-spacing:1px}
  .sc-sub{font-size:13.5px;color:var(--ink-faint);font-weight:700;margin-top:3px}
  .sc-prog{margin-top:13px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);font-weight:800}
  .sc-bar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .sc-fill{height:100%;background:var(--sc);width:0%;transition:width .4s}
  .sc-clear{font-size:13px;color:var(--good);font-weight:800}
  .home-tip{text-align:center;font-size:13.5px;color:var(--ink-faint);margin-top:18px;line-height:1.6}

  /* study */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .back{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .back svg{display:block}
  .study-name{font-family:var(--jp)!important}
  .back:active{transform:translateY(1px)}
  .study-name{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
  .study-stars{font-size:12px;color:var(--sc);font-weight:800;margin-left:auto}
  .prog{margin:10px 0 6px;display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;color:var(--ink-soft);font-weight:700}
  .prog .bar{max-width:220px}
  .prog .fill{background:var(--sc)}

  #study{flex:1;display:flex;flex-direction:column;min-height:0}
  .studymid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
  .card3d{width:100%;height:clamp(360px,56vh,520px);display:flex;flex-direction:column}
  .inner{position:relative;width:100%;flex:1;cursor:pointer}
  .face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;overflow:hidden;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
  .face::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:var(--sc)}
  .back{background:var(--card2)}
  .front{justify-content:center;gap:clamp(16px,3.6vh,38px)}
  /* front shown by default; flip swaps to back. Hidden face gets pointer-events:none so taps always hit the visible face's buttons. */
  .inner .front{opacity:1;pointer-events:auto;transform:scale(1)}
  .inner.flip .front{opacity:0;pointer-events:none;transform:scale(.97)}
  .inner.flip .back{opacity:1;pointer-events:auto;transform:scale(1)}
  .emoji{font-size:clamp(96px,16vh,176px);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
  .word{font-family:var(--jp);font-weight:700;font-size:clamp(26px,7vw,42px);color:var(--ink);line-height:1.25;max-width:100%;overflow-wrap:anywhere;padding:0 6px}
  .pos{margin-top:2px;font-size:16px;font-weight:700;color:var(--ink-soft);font-family:var(--jp)}
  .tiphint{font-size:15px;color:var(--ink-faint);font-weight:700}
  .listen{position:absolute;top:14px;right:14px;border:none;background:var(--accent-soft);color:var(--accent-d);width:52px;height:52px;border-radius:50%;font-size:23px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .listen:active{transform:scale(.92)}
  .b-read{font-family:var(--jp);font-size:16px;font-weight:700;color:var(--ink-soft);margin-bottom:2px}
  .b-word{font-family:var(--jp);font-weight:700;font-size:clamp(24px,7vw,32px);color:var(--sc);margin-bottom:16px}
  .def{font-family:var(--jp);font-size:clamp(20px,5.6vw,27px);line-height:1.5;color:var(--ink);font-weight:700;max-width:22ch}
  .ex{margin-top:16px;font-family:var(--jp);font-size:clamp(16px,4.6vw,20px);line-height:1.6;color:var(--ink-soft);font-style:normal;max-width:24ch}
  .ex b{color:var(--warm);font-style:normal;font-weight:800}
  .jp{margin-top:16px}
  .jp button{border:1px dashed var(--line2);background:transparent;color:var(--ink-faint);font-family:var(--jp);font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 14px;cursor:pointer}
  .jp .word-jp{display:inline-block;font-family:var(--jp);font-weight:700;color:var(--ink-soft);font-size:15px}
  .jp .word-en{display:block;font-family:var(--body);font-weight:700;font-style:italic;color:var(--ink-faint);font-size:14px;margin-top:5px}

  .controls{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px}
  .nav{border:1px solid var(--line2);background:var(--card);color:var(--ink);width:54px;height:54px;border-radius:16px;font-size:22px;cursor:pointer;box-shadow:var(--shadow);font-weight:800}
  .nav:active{transform:translateY(2px)}
  .know{flex:1;max-width:220px;border:none;border-radius:16px;padding:16px;font-family:var(--body);font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow);background:var(--sc);color:#fff}
  .know.on{background:var(--good)}
  .know:active{transform:translateY(2px)}
  .row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .mini{border:1px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:12px;padding:9px 14px;font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer}
  .mini:active{transform:translateY(1px)}
  .hint-line{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:12px;line-height:1.6}
  .done-msg{text-align:center;background:var(--good-soft);border:1px solid var(--good);border-radius:16px;padding:14px;color:var(--good);font-weight:800;margin-top:12px}
  @media (max-width:380px){.emoji{font-size:clamp(54px,9vh,80px)}}

  /* --- 今日カウンタ＆検問(テスト) --- */
  .quizbox{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin:0 auto 14px;max-width:420px;text-align:center}
  .quiz-start{width:100%;border:none;border-radius:14px;padding:13px;font-family:var(--body);font-weight:800;font-size:15px;color:#fff;background:var(--accent);box-shadow:0 3px 0 var(--accent-d);cursor:pointer}
  .quiz-start:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
  .quiz-rec{margin-top:8px;font-size:12.5px;color:var(--ink-faint);font-weight:700;line-height:1.5}
  #quiz{flex:1;display:flex;flex-direction:column;min-height:0}
  #quiz .fill{background:var(--accent)}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
  .qcard::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:var(--accent)}
  .q-prompt{font-family:var(--jp);font-weight:700;font-size:clamp(26px,7vw,40px);color:var(--ink);text-align:center;overflow-wrap:anywhere;line-height:1.25}
  .q-sub{font-size:15px;color:var(--ink-soft);font-weight:700;font-family:var(--jp)}
  .q-choices{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
  .q-choice{width:100%;border:1.5px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:14px;padding:14px 12px;font-family:var(--jp);font-weight:700;font-size:16px;cursor:pointer;text-align:center;line-height:1.4}
  .q-choice:active{transform:translateY(1px)}
  .q-choice:disabled{cursor:default}
  .q-choice.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .q-choice.ng{background:#fde8e8;border-color:#e2574f;color:#c0392b}
  .q-fb{min-height:22px;font-weight:800;font-size:15px;color:var(--ink-soft);font-family:var(--jp);text-align:center}
  .qresult{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 18px;text-align:center}
  .qr-score{font-family:var(--disp);font-weight:700;font-size:44px;color:var(--accent-d)}
  .qr-msg{font-family:var(--jp);font-weight:800;font-size:18px;color:var(--ink);margin:8px 0}
  .qr-rec{font-size:13px;color:var(--ink-faint);font-weight:700;margin-bottom:16px}
  .qr-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .q-again,.q-home{border:none;border-radius:14px;padding:12px 18px;font-family:var(--body);font-weight:800;font-size:14px;cursor:pointer}
  .q-again{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
  .q-home{background:var(--card2);color:var(--ink-soft);border:1.5px solid var(--line2)}
  .q-again:active,.q-home:active{transform:translateY(1px)}
</style>

<div class="wrap">
  <a href="./index.html" class="toboard">← クエストボード</a>
  <header>
    <p class="eyebrow">Chugaku Vocab · 語彙カード</p>
    <h1 id="h1">語彙カード 📖</h1>
  </header>

var si=0, order=[], idx=0, flipped=false, filterOn=false;

function loadKnown(){var k=window.qbKEnsure?qbKEnsure('jvocab'):{},o={},w;for(w in k){if(k[w]>0)o[w]=true;}return o;}
function kSet(w,on){var k=window.qbKEnsure?qbKEnsure('jvocab'):{};k[w]=on?Date.now():-Date.now();try{localStorage.setItem('jvocab_kts',JSON.stringify(k));}catch(e){}}
function learnedCount(){return STAGES.reduce(function(n,s){return n+stageKnown(s);},0);}
function writeStats(){try{var o={};try{o=JSON.parse(localStorage.getItem('jvocab_stats')||'{}')||{};}catch(_){}o.learned=learnedCount();o.deckSize=TOTAL;o.goal=GOAL;o.updated=Date.now();var _ts=(function(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();})();o.today=(typeof ALLW!=='undefined')?qTodayCount():0;o.tday=_ts;localStorage.setItem('jvocab_stats',JSON.stringify(o));}catch(e){}}
function saveKnown(){try{localStorage.setItem('jvocab_known',JSON.stringify(known));}catch(e){}writeStats();try{var o=JSON.parse(localStorage.getItem('jvocab_stats')||'{}');o.studiedAt=Date.now();localStorage.setItem('jvocab_stats',JSON.stringify(o));}catch(e){}if(window.qbSyncKick)qbSyncKick();}
function stageKnown(s){return s.words.filter(function(c){return known[c.w];}).length;}

function renderHome(){
  var kc=learnedCount();
  document.getElementById('ovCount').textContent=kc;
  document.getElementById('ovFill').style.width=Math.min(100,kc/GOAL*100)+'%';
  document.getElementById('ovPct').textContent=Math.round(kc/GOAL*100)+'%';
  document.getElementById('ovDeck').textContent=TOTAL;var _ot=document.getElementById('ovToday');if(_ot)_ot.textContent=qTodayCount();renderQuizRec();
  writeStats();
  var html=STAGES.map(function(s,i){
    var k=stageKnown(s), t=s.words.length, pct=Math.round(k/t*100), clear=(k===t);
    var stars='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
    return '<button class="stage-card" style="--sc:'+s.color+'" onclick="openStage('+i+')">'
      +'<div class="sc-top"><span class="sc-name">'+s.name+'</span><span class="sc-stars">'+stars+'</span></div>'
      +'<div class="sc-sub">'+s.sub+' ・ '+t+'語</div>'
      +'<div class="sc-prog"><span>覚えた '+k+' / '+t+'</span><div class="sc-bar"><div class="sc-fill" style="width:'+pct+'%"></div></div>'
      +(clear?'<span class="sc-clear">クリア！⭐</span>':'<span>'+pct+'%</span>')+'</div>'
      +'</button>';
  }).join('');
  document.getElementById('stageList').innerHTML=html;
}

function openStage(i){si=i;order=STAGES[i].words.map(function(_,n){return n;});idx=0;filterOn=false;
  document.getElementById('home').hidden=true;document.getElementById('study').hidden=false;
  var s=STAGES[i];document.getElementById('study').style.setProperty('--sc',s.color);
  document.getElementById('studyName').textContent=s.name;
  document.getElementById('studyStars').textContent='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
  render();window.scrollTo(0,0);
}
function showHome(){document.getElementById('study').hidden=true;document.getElementById('home').hidden=false;renderHome();window.scrollTo(0,0);}

function activeOrder(){if(!filterOn)return order;var w=STAGES[si].words;var f=order.filter(function(n){return !known[w[n].w];});return f.length?f:order;}
function curCard(){var o=activeOrder();if(idx>=o.length)idx=0;return STAGES[si].words[o[idx]];}

function render(){
  var w=STAGES[si].words,o=activeOrder();if(idx>=o.length)idx=o.length-1;if(idx<0)idx=0;
  var c=w[o[idx]];
  flipped=false;document.getElementById('inner').classList.remove('flip');
  document.getElementById('fEmoji').textContent=c.e;
  document.getElementById('fWord').textContent=c.w;
  document.getElementById('fPos').textContent=c.pos;
  document.getElementById('bRead').textContent=c.pos;
  document.getElementById('bWord').textContent=c.w;
  document.getElementById('bDef').textContent=c.def;
  document.getElementById('bEx').innerHTML=c.ex;
  document.getElementById('jpBtn').outerHTML='<button id="jpBtn" onclick="toggleJp(event)">ヒントを見る</button>';
  document.getElementById('posLabel').textContent=(idx+1)+' / '+o.length;
  var k=stageKnown(STAGES[si]);
  document.getElementById('knownLabel').textContent='覚えた '+k;
  document.getElementById('fill').style.width=(k/w.length*100)+'%';
  var kb=document.getElementById('knowBtn');
  if(known[c.w]){kb.classList.add('on');kb.textContent='✓ 覚えた！';}else{kb.classList.remove('on');kb.textContent='覚えた！';}
  document.getElementById('filterBtn').style.outline=filterOn?'2px solid '+STAGES[si].color:'none';
}
function flip(){flipped=!flipped;document.getElementById('inner').classList.toggle('flip',flipped);}
function next(){var o=activeOrder();idx=(idx+1)%o.length;render();}
function prev(){var o=activeOrder();idx=(idx-1+o.length)%o.length;render();}
function toggleKnow(){var c=curCard();var _was=!!known[c.w];known[c.w]=!known[c.w];kSet(c.w,known[c.w]);saveKnown();
  var allNow=STAGES[si].words.every(function(d){return known[d.w];});
  render();if(allNow)setTimeout(function(){showDone(STAGES[si].name);},250);}
function toggleFilter(){filterOn=!filterOn;idx=0;render();}
function shuffle(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}idx=0;render();}
function fmtHint(j){return /^(対義|意味|類似|同義|反対|例|参考)/.test(j)?j:'類似：'+j;}
function toggleJp(ev){ev.stopPropagation();var c=curCard();var en=EN[c.w]?'<span class="word-en">'+EN[c.w]+'</span>':'';document.getElementById('jpBtn').outerHTML='<span class="word-jp" id="jpBtn">💡 '+fmtHint(c.jp)+en+'</span>';}
var enVoice=null;
function pickVoice(){try{if(!('speechSynthesis'in window))return;var vs=window.speechSynthesis.getVoices()||[];if(!vs.length)return;
  enVoice=vs.filter(function(v){return /ja[-_]JP/i.test(v.lang);})[0]
    ||vs.filter(function(v){return /^ja/i.test(v.lang);})[0]
    ||enVoice;}catch(e){}}
try{if('speechSynthesis'in window){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function speakWord(ev){if(ev){ev.stopPropagation();}var c=curCard();
  try{
    if(!('speechSynthesis'in window)){alert('この端末は音声読み上げに対応していません');return;}
    var ss=window.speechSynthesis;ss.cancel();if(ss.paused){try{ss.resume();}catch(e){}}
    if(!enVoice)pickVoice();
    var u=new SpeechSynthesisUtterance(c.pos||c.w);u.lang='ja-JP';u.rate=.95;u.pitch=1;
    if(enVoice)u.voice=enVoice;
    ss.speak(u);
    // some mobile engines stall right after load; nudge with a resume on next tick
    setTimeout(function(){try{if(ss.paused)ss.resume();}catch(e){}},80);
  }catch(e){}}
function showDone(name){var st=document.getElementById('study');if(document.getElementById('doneMsg'))return;var d=document.createElement('div');d.className='done-msg';d.id='doneMsg';d.textContent='🎉 '+name+' クリア！全部覚えたね！';var _rf=st.querySelector('.card3d');(_rf&&_rf.parentNode?_rf.parentNode:st).insertBefore(d,_rf&&_rf.parentNode?_rf:null);setTimeout(function(){if(d)d.remove();},4000);}


/* ===== 今日カウンタ（今日覚えた語） ===== */
function qTodayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function _qs(){try{return JSON.parse(localStorage.getItem('jvocab_stats')||'{}')||{};}catch(e){return {};}}
function _qsSave(o){try{localStorage.setItem('jvocab_stats',JSON.stringify(o));}catch(e){}}
function bumpToday(delta){if(!delta)return;var o=_qs();var ts=qTodayStr();if(o.tday!==ts){o.today=0;}o.today=Math.max(0,(o.today||0)+delta);o.tday=ts;_qsSave(o);}
function qTodayCount(){var k=window.qbKEnsure?qbKEnsure('jvocab'):{},n=new Date(),c=0;
  ALLW.forEach(function(x){var t=k[x.w];if(t>1){var d=new Date(t);if(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate())c++;}});return c;}
/* ===== 検問（テスト） ===== */
var ALLW=[];STAGES.forEach(function(s){s.words.forEach(function(w){ALLW.push(w);});});
/* 収録語リスト：ボードの「いま収録○語」「覚えた語」はこのリストで数える。語を足したり減らしたりしたら DECK_VER を上げる */
var DECK_VER=2026111201;
try{var _dk=JSON.stringify({v:DECK_VER,w:ALLW.map(function(x){return x.w;})});if(localStorage.getItem(QB_APP+'_deck')!==_dk)localStorage.setItem(QB_APP+'_deck',_dk);if(window.qbSyncKick)qbSyncKick();}catch(e){}
function QANS(c){return c.def;}
/* 合格ライン：クエストボードの保護者メニューで設定（同じ端末の設定を読む） */
function qPassCfg(){var c={};try{c=(JSON.parse(localStorage.getItem('questboard_v3')||'{}')||{}).cfg||{};}catch(e){}return {pct:+c.passPct||50,min:+c.passMin||10};}
/* ボードの日替わり：今日このクエストがパーフェクトのカウント外か（ボードが今日記録した rot を見る） */
function qRotOff(){try{var s=JSON.parse(localStorage.getItem('questboard_v3')||'{}')||{},r=s.rot,d=new Date(),p=function(n){return (n<10?'0':'')+n;},td=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());return !!(r&&r.d===td&&r.off&&r.off.indexOf('j')>=0);}catch(e){return false;}}
function loadQuiz(){var o=_qs();return o.quiz||{tests:0,perfects:0,bestPct:0,last:null};}
function saveQuizRec(q){var o=_qs();o.quiz=q;_qsSave(o);if(window.qbSyncKick)qbSyncKick();}
function renderQuizRec(){var el=document.getElementById('quizRec');if(!el)return;var q=loadQuiz();var learned=learnedCount();
  if(learned<4){el.textContent='覚えた語から4択クイズ。あと'+(4-learned)+'語覚えると挑戦できるよ';return;}
  el.innerHTML='受けた '+(q.tests||0)+'回 ・ 満点 '+(q.perfects||0)+'回'+(q.bestPct?' ・ 自己ベスト '+q.bestPct+'%':'')+(q.last?'（前回 '+q.last.s+'/'+q.last.t+'）':'');}
var QZ=null;
function qshuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(){
  var pool=ALLW.filter(function(c){return known[c.w];});
  if(pool.length<4){alert('覚えた語が4つ以上になったら挑戦できるよ！');return;}
  var n=Math.min(14,pool.length);
  QZ={qs:qshuf(pool.slice()).slice(0,n),i:0,right:0,answered:false};
  document.getElementById('home').hidden=true;document.getElementById('study').hidden=true;document.getElementById('quiz').hidden=false;
  document.getElementById('qResult').hidden=true;document.getElementById('qCard').hidden=false;
  renderQ();window.scrollTo(0,0);}
function quizHome(){document.getElementById('quiz').hidden=true;document.getElementById('home').hidden=false;renderHome();window.scrollTo(0,0);}
function renderQ(){
  var c=QZ.qs[QZ.i];QZ.answered=false;
  document.getElementById('qWord').textContent=c.w;
  var sub=document.getElementById('qSub');if(sub)sub.textContent=(c.pos||'');
  var correct=QANS(c),seen={};seen[correct]=1;var dis=[];
  var others=qshuf(ALLW.slice());
  for(var k=0;k<others.length&&dis.length<3;k++){var a=QANS(others[k]);if(a&&!seen[a]){seen[a]=1;dis.push(a);}}
  var choices=qshuf([correct].concat(dis));
  var ch=document.getElementById('qChoices');ch.innerHTML='';
  choices.forEach(function(t){var b=document.createElement('button');b.className='q-choice';b.textContent=t;b.onclick=function(){answerQ(t,b);};ch.appendChild(b);});
  document.getElementById('qFb').textContent='';
  document.getElementById('qPos').textContent=(QZ.i+1)+' / '+QZ.qs.length;
  document.getElementById('qRight').textContent='正解 '+QZ.right;
  document.getElementById('qFill').style.width=(QZ.i/QZ.qs.length*100)+'%';}
function answerQ(t,btn){
  if(QZ.answered)return;QZ.answered=true;
  var c=QZ.qs[QZ.i],correct=QANS(c);
  var btns=document.querySelectorAll('#qChoices .q-choice');
  for(var k=0;k<btns.length;k++){btns[k].disabled=true;if(btns[k].textContent===correct)btns[k].classList.add('ok');}
  if(t===correct){QZ.right++;document.getElementById('qFb').textContent='⭕ 正解！';}
  else{btn.classList.add('ng');document.getElementById('qFb').innerHTML='❌ 正解は「'+correct+'」';}
  document.getElementById('qRight').textContent='正解 '+QZ.right;
  setTimeout(function(){QZ.i++;if(QZ.i<QZ.qs.length)renderQ();else finishQuiz();},1000);}
function finishQuiz(){
  var n=QZ.qs.length,r=QZ.right,pct=Math.round(r/n*100);
  var q=loadQuiz();q.tests=(q.tests||0)+1;if(r===n)q.perfects=(q.perfects||0)+1;q.bestPct=Math.max(q.bestPct||0,pct);q.last={s:r,t:n};q.updated=Date.now();var _hd=qTodayStr();if(!q.hist||q.hist.d!==_hd)q.hist={d:_hd,r:[]};q.hist.r.push([r,n,q.updated]);if(q.hist.r.length>30)q.hist.r=q.hist.r.slice(-30);
  q.days=q.days||{};var _dd=q.days[_hd]||{t:0,p:0,b:0};_dd.t=Math.max((_dd.t||0)+1,q.hist.r.length);if(r===n)_dd.p=(_dd.p||0)+1;_dd.b=Math.max(_dd.b||0,pct);var _pcx=qPassCfg();if(n>=_pcx.min&&pct>=_pcx.pct)_dd.ok=1;q.days[_hd]=_dd;
  var _dk=Object.keys(q.days);if(_dk.length>400){_dk.sort(function(a,b){var x=a.split('-'),y=b.split('-');return (x[0]*1e4+x[1]*100+ +x[2])-(y[0]*1e4+y[1]*100+ +y[2]);});while(_dk.length>400)delete q.days[_dk.shift()];}
  saveQuizRec(q);var _pc=qPassCfg(),_pass=(n>=_pc.min&&pct>=_pc.pct);
  document.getElementById('qCard').hidden=true;
  var res=document.getElementById('qResult');res.hidden=false;
  var msg=(r===n)?'🏆 満点！すごい！':(pct>=80?'👏 よくできました！':(pct>=50?'🙂 その調子！':'💪 もう一度やってみよう'));
  res.innerHTML='<div class="qr-score">'+r+' / '+n+'</div><div class="qr-msg">'+msg+'</div>'
    +(_pass?(qRotOff()?'<div style="font-weight:800;color:#8a7d64;margin:2px 0 10px">✅ 検問クリア！<br><span style="font-size:.85em">ただし今日は🔤 英単語の日なので、パーフェクトカウント外だよ</span></div>':'<div style="font-weight:800;color:#b7791f;margin:2px 0 10px">✅ 検問クリア！（コミットライン）クエストボードを見てみよう</div>'):'<div class="qr-rec">コミットライン：'+(_pc.pct>=100?'満点':_pc.pct+'点以上')+'・'+_pc.min+'問以上</div>')
    +'<div class="qr-rec">受けた '+q.tests+'回 ・ 満点 '+q.perfects+'回 ・ 自己ベスト '+q.bestPct+'%</div>'
    +'<div class="qr-btns"><button class="q-again" onclick="startQuiz()">🔁 もう一度</button><button class="q-home" onclick="quizHome()">🏠 ホームへ</button></div>';
  document.getElementById('qFill').style.width='100%';window.scrollTo(0,0);}

(function(){var k=window.qbKEnsure?qbKEnsure('jvocab'):{},inDeck={},ch=false,w;ALLW.forEach(function(x){inDeck[x.w]=1;});
  for(w in k){if(k[w]>0&&!inDeck[w]){k[w]=-Date.now();ch=true;}}
  if(ch){try{localStorage.setItem('jvocab_kts',JSON.stringify(k));}catch(e){}known=loadKnown();if(window.qbSyncKick)qbSyncKick();}})();
window.qbOnKnownSync=function(){known=loadKnown();writeStats();
  if(!document.getElementById('home').hidden)renderHome();else if(!document.getElementById('study').hidden)render();};
renderHome();
</script>
