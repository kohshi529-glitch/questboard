<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中学入試 語彙クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
  :root{
    --bg:#f4f1e8; --card:#ffffff; --card2:#fbf9f3;
    --ink:#283042; --ink-soft:#5a6475; --ink-faint:#8b94a4;
    --line:#e6e1d4; --line2:#d8d2c2;
    --accent:#1f9e8e; --accent-d:#17867a; --accent-soft:#e3f4f1;
    --warm:#f4a23b; --warm-soft:#fcecd6;
    --good:#2f9e5e; --good-soft:#e4f3e9;
    --s1:#2f9e5e; --s2:#1f9e8e; --s3:#e0892a; --s4:#d6504e;
    --shadow:0 2px 4px rgba(40,48,66,.06),0 10px 26px rgba(40,48,66,.10);
    --disp:"Fredoka","Nunito",system-ui,sans-serif;
    --body:"Nunito",system-ui,-apple-system,sans-serif;
    --jp:"Noto Sans JP",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#14171d; --card:#1f232c; --card2:#262b35;
      --ink:#eef1f6; --ink-soft:#b9c0cc; --ink-faint:#8a93a2;
      --line:#333945; --line2:#3e4552;
      --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
      --warm:#f3b05f; --warm-soft:#33291a;
      --good:#6fcf90; --good-soft:#1e3326;
      --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#14171d; --card:#1f232c; --card2:#262b35;
    --ink:#eef1f6; --ink-soft:#b9c0cc; --ink-faint:#8a93a2;
    --line:#333945; --line2:#3e4552;
    --accent:#49c9b7; --accent-d:#39b3a2; --accent-soft:#1d3330;
    --warm:#f3b05f; --warm-soft:#33291a;
    --good:#6fcf90; --good-soft:#1e3326;
    --s1:#6fcf90; --s2:#49c9b7; --s3:#eab464; --s4:#f0807e;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding-block:20px 30px;padding-left:18px;padding-right:18px;min-height:100%;display:flex;flex-direction:column}
  .toboard{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-family:var(--jp);font-weight:800;font-size:13px;color:var(--accent-d);background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:var(--shadow);margin-bottom:4px}
  .toboard:active{transform:translateY(1px)}
  #home{flex:1;display:flex;flex-direction:column}
  header{text-align:center;margin-bottom:8px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:800;margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:2px 0 0;color:var(--ink)}
  .bar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4));width:0%;transition:width .4s}
  .goalbox{margin:14px auto 20px;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);padding:16px 18px}
  .goal-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .goal-top .goal-v{color:var(--accent-d)}
  .goal-main{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--ink);margin:6px 0 10px}
  .goal-main .goal-unit{font-size:15px;color:var(--ink-faint);font-weight:700}
  .goalbox .bar{height:11px;margin:0}
  .goal-sub{margin-top:8px;font-size:12px;color:var(--ink-faint);font-weight:700}

  /* home: stage list — cards sized to content, bigger text (NOT stretched) */
  .stages{display:grid;gap:12px;margin:14px 0}
  .stage-card{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--sc);border-radius:18px;
    box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;display:block;width:100%;text-align:left;font-family:var(--body)}
  .stage-card:active{transform:translateY(1px)}
  .sc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sc-name{font-family:var(--disp);font-weight:700;font-size:21px;color:var(--ink)}
  .sc-stars{font-size:15px;color:var(--sc);font-weight:800;letter-spacing:1px}
  .sc-sub{font-size:13.5px;color:var(--ink-faint);font-weight:700;margin-top:3px}
  .sc-prog{margin-top:13px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);font-weight:800}
  .sc-bar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .sc-fill{height:100%;background:var(--sc);width:0%;transition:width .4s}
  .sc-clear{font-size:13px;color:var(--good);font-weight:800}
  .home-tip{text-align:center;font-size:13.5px;color:var(--ink-faint);margin-top:18px;line-height:1.6}

  /* study */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .back{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .back svg{display:block}
  .study-name{font-family:var(--jp)!important}
  .back:active{transform:translateY(1px)}
  .study-name{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
  .study-stars{font-size:12px;color:var(--sc);font-weight:800;margin-left:auto}
  .prog{margin:10px 0 6px;display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;color:var(--ink-soft);font-weight:700}
  .prog .bar{max-width:220px}
  .prog .fill{background:var(--sc)}

  #study{flex:1;display:flex;flex-direction:column;min-height:0}
  .studymid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
  .card3d{width:100%;height:clamp(360px,56vh,520px);display:flex;flex-direction:column}
  .inner{position:relative;width:100%;flex:1;cursor:pointer}
  .face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;overflow:hidden;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
  .face::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:var(--sc)}
  .back{background:var(--card2)}
  .front{justify-content:center;gap:clamp(16px,3.6vh,38px)}
  /* front shown by default; flip swaps to back. Hidden face gets pointer-events:none so taps always hit the visible face's buttons. */
  .inner .front{opacity:1;pointer-events:auto;transform:scale(1)}
  .inner.flip .front{opacity:0;pointer-events:none;transform:scale(.97)}
  .inner.flip .back{opacity:1;pointer-events:auto;transform:scale(1)}
  .emoji{font-size:clamp(96px,16vh,176px);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
  .word{font-family:var(--jp);font-weight:700;font-size:clamp(26px,7vw,42px);color:var(--ink);line-height:1.25;max-width:100%;overflow-wrap:anywhere;padding:0 6px}
  .pos{margin-top:2px;font-size:16px;font-weight:700;color:var(--ink-soft);font-family:var(--jp)}
  .tiphint{font-size:15px;color:var(--ink-faint);font-weight:700}
  .listen{position:absolute;top:14px;right:14px;border:none;background:var(--accent-soft);color:var(--accent-d);width:52px;height:52px;border-radius:50%;font-size:23px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .listen:active{transform:scale(.92)}
  .b-read{font-family:var(--jp);font-size:16px;font-weight:700;color:var(--ink-soft);margin-bottom:2px}
  .b-word{font-family:var(--jp);font-weight:700;font-size:clamp(24px,7vw,32px);color:var(--sc);margin-bottom:16px}
  .def{font-family:var(--jp);font-size:clamp(20px,5.6vw,27px);line-height:1.5;color:var(--ink);font-weight:700;max-width:22ch}
  .ex{margin-top:16px;font-family:var(--jp);font-size:clamp(16px,4.6vw,20px);line-height:1.6;color:var(--ink-soft);font-style:normal;max-width:24ch}
  .ex b{color:var(--warm);font-style:normal;font-weight:800}
  .jp{margin-top:16px}
  .jp button{border:1px dashed var(--line2);background:transparent;color:var(--ink-faint);font-family:var(--jp);font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 14px;cursor:pointer}
  .jp .word-jp{display:inline-block;font-family:var(--jp);font-weight:700;color:var(--ink-soft);font-size:15px}
  .jp .word-en{display:block;font-family:var(--body);font-weight:700;font-style:italic;color:var(--ink-faint);font-size:14px;margin-top:5px}

  .controls{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px}
  .nav{border:1px solid var(--line2);background:var(--card);color:var(--ink);width:54px;height:54px;border-radius:16px;font-size:22px;cursor:pointer;box-shadow:var(--shadow);font-weight:800}
  .nav:active{transform:translateY(2px)}
  .know{flex:1;max-width:220px;border:none;border-radius:16px;padding:16px;font-family:var(--body);font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow);background:var(--sc);color:#fff}
  .know.on{background:var(--good)}
  .know:active{transform:translateY(2px)}
  .row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .mini{border:1px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:12px;padding:9px 14px;font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer}
  .mini:active{transform:translateY(1px)}
  .hint-line{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:12px;line-height:1.6}
  .done-msg{text-align:center;background:var(--good-soft);border:1px solid var(--good);border-radius:16px;padding:14px;color:var(--good);font-weight:800;margin-top:12px}
  @media (max-width:380px){.emoji{font-size:clamp(54px,9vh,80px)}}
</style>

<div class="wrap">
  <a href="./index.html" class="toboard">← クエストボード</a>
  <header>
    <p class="eyebrow">Chugaku Vocab · 語彙カード</p>
    <h1 id="h1">語彙カード 📖</h1>
  </header>

  <!-- HOME -->
  <div id="home">
    <div class="goalbox">
      <div class="goal-top"><span>🎯 めざす目標</span><span class="goal-v">約1,400語</span></div>
      <div class="goal-main"><span id="ovCount">0</span> <span class="goal-unit">語 覚えた</span></div>
      <div class="bar"><div class="fill" id="ovFill"></div></div>
      <div class="goal-sub"><span id="ovPct">0%</span> ・ いま収録 <span id="ovDeck">200</span>語（順次ふやします）</div>
    </div>
    <div class="stages" id="stageList"></div>
    <div class="home-tip">やさしいステージから、少しずつ上へ。⭐が多いほど難しい単語です。<br>全部覚えたステージには「クリア！」がつきます。</div>
  </div>

  <!-- STUDY -->
  <div id="study" hidden>
    <div class="topbar">
      <button class="back" onclick="showHome()" aria-label="ステージ一覧へもどる" title="ステージ一覧へもどる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg></button>
      <span class="study-name" id="studyName"></span>
      <span class="study-stars" id="studyStars"></span>
    </div>
    <div class="studymid">
    <div class="prog">
      <span id="posLabel">1 / 14</span>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <span id="knownLabel">覚えた 0</span>
    </div>
    <div class="card3d">
      <div class="inner" id="inner" onclick="flip()">
        <div class="face front">
          <button class="listen" onclick="speakWord(event)" aria-label="listen">🔊</button>
          <div class="emoji" id="fEmoji">🙂</div>
          <div class="word" id="fWord">word</div>
          <div class="pos" id="fPos">adj</div>
          <div class="tiphint">タップで いみを見る 👆</div>
        </div>
        <div class="face back">
          <button class="listen" onclick="speakWord(event)" aria-label="listen">🔊</button>
          <div class="b-read" id="bRead">よみ</div>
          <div class="b-word" id="bWord">word</div>
          <div class="def" id="bDef">definition</div>
          <div class="ex" id="bEx"></div>
          <div class="jp"><button id="jpBtn" onclick="toggleJp(event)">ヒントを見る</button></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="nav" onclick="prev()" aria-label="まえ">◀</button>
      <button class="know" id="knowBtn" onclick="toggleKnow()">覚えた！</button>
      <button class="nav" onclick="next()" aria-label="つぎ">▶</button>
    </div>
    <div class="row2">
      <button class="mini" onclick="shuffle()">🔀 シャッフル</button>
      <button class="mini" id="filterBtn" onclick="toggleFilter()">🔁 まだのカードだけ</button>
    </div>
    <div class="hint-line">カードをタップで意味を見る／🔊で読み方／「覚えた！」でチェック。<br>まずは言葉から意味を考えてみよう。</div>
    </div>
  </div>
</div>

<script>
const STAGES=[
 {name:"ステージ1 基礎",sub:"中学入試 基礎語彙",stars:2,color:"var(--s1)",words:[
  {w:"我慢",pos:"がまん",e:"😤",def:"じっとこらえること",ex:"苦しくても<b>我慢</b>した",jp:"こらえる"},
  {w:"油断",pos:"ゆだん",e:"😮‍💨",def:"気をゆるめて注意を忘れること",ex:"<b>油断</b>して失敗した",jp:"対義：用心"},
  {w:"得意",pos:"とくい",e:"😎",def:"上手で自信があること",ex:"歌が<b>得意</b>だ",jp:"対義：苦手"},
  {w:"苦手",pos:"にがて",e:"😣",def:"うまくできない・きらいなこと",ex:"虫が<b>苦手</b>だ",jp:"対義：得意"},
  {w:"単純",pos:"たんじゅん",e:"🟢",def:"こみ入っていないこと",ex:"<b>単純</b>な問題",jp:"対義：複雑"},
  {w:"複雑",pos:"ふくざつ",e:"🧩",def:"こみ入っていること",ex:"<b>複雑</b>な気持ち",jp:"対義：単純"},
  {w:"丁寧",pos:"ていねい",e:"🙇",def:"心をこめてきちんとすること",ex:"<b>丁寧</b>に書く",jp:"対義：乱暴"},
  {w:"平気",pos:"へいき",e:"😌",def:"気にしない・大丈夫なこと",ex:"寒くても<b>平気</b>だ",jp:"へっちゃら"},
  {w:"真剣",pos:"しんけん",e:"🔥",def:"本気で取り組むこと",ex:"<b>真剣</b>に考える",jp:"本気"},
  {w:"夢中",pos:"むちゅう",e:"🤩",def:"一つのことに心をうばわれること",ex:"ゲームに<b>夢中</b>だ",jp:"没頭"},
  {w:"感心",pos:"かんしん",e:"👏",def:"りっぱだと思って心を動かすこと",ex:"努力に<b>感心</b>した",jp:"ほめる気持ち"},
  {w:"感動",pos:"かんどう",e:"🥹",def:"強く心を動かされること",ex:"映画に<b>感動</b>した",jp:"心を打たれる"},
  {w:"工夫",pos:"くふう",e:"💡",def:"うまくいくように考えること",ex:"使いやすく<b>工夫</b>する",jp:"アイデア"},
  {w:"努力",pos:"どりょく",e:"💪",def:"がんばって力をつくすこと",ex:"毎日<b>努力</b>する",jp:"がんばり"},
  {w:"用心",pos:"ようじん",e:"🛡️",def:"悪いことが起きないよう気をつけること",ex:"火に<b>用心</b>する",jp:"対義：油断"},
  {w:"判断",pos:"はんだん",e:"⚖️",def:"どうするか決めること",ex:"すぐに<b>判断</b>した",jp:"見きわめる"},
  {w:"想像",pos:"そうぞう",e:"🌈",def:"頭の中で思いえがくこと",ex:"未来を<b>想像</b>する",jp:"思いえがく"},
  {w:"創造",pos:"そうぞう",e:"🎨",def:"新しく生み出すこと",ex:"作品を<b>創造</b>する",jp:"生み出す"},
  {w:"比較",pos:"ひかく",e:"🆚",def:"くらべること",ex:"二つを<b>比較</b>する",jp:"くらべる"},
  {w:"増加",pos:"ぞうか",e:"📈",def:"数や量がふえること",ex:"人口が<b>増加</b>する",jp:"対義：減少"},
  {w:"減少",pos:"げんしょう",e:"📉",def:"数や量がへること",ex:"売上が<b>減少</b>する",jp:"対義：増加"},
  {w:"共通",pos:"きょうつう",e:"🔗",def:"みんなに当てはまること",ex:"<b>共通</b>の趣味",jp:"対義：個別"},
  {w:"発達",pos:"はったつ",e:"🌱",def:"だんだん育って伸びること",ex:"技術が<b>発達</b>する",jp:"発展"},
  {w:"発展",pos:"はってん",e:"🚀",def:"さらに大きく進むこと",ex:"町が<b>発展</b>する",jp:"発達"},
  {w:"解決",pos:"かいけつ",e:"✅",def:"問題をうまくおさめること",ex:"事件が<b>解決</b>した",jp:"かたづく"},
  {w:"原因",pos:"げんいん",e:"🔎",def:"物事が起こるもと",ex:"事故の<b>原因</b>を調べる",jp:"対義：結果"},
  {w:"結果",pos:"けっか",e:"🏁",def:"物事の終わりに出てくること",ex:"努力の<b>結果</b>",jp:"対義：原因"},
  {w:"目的",pos:"もくてき",e:"🎯",def:"めざすねらい",ex:"旅行の<b>目的</b>",jp:"ねらい"},
  {w:"手段",pos:"しゅだん",e:"🛠️",def:"目的を果たすための方法",ex:"連絡の<b>手段</b>",jp:"方法"},
  {w:"具体",pos:"ぐたい",e:"📦",def:"はっきりした形があること",ex:"<b>具体</b>的な例",jp:"対義：抽象"},
  {w:"抽象",pos:"ちゅうしょう",e:"🌀",def:"形のない考えだけのこと",ex:"<b>抽象</b>的な話",jp:"対義：具体"},
  {w:"共感",pos:"きょうかん",e:"🤝",def:"相手と同じ気持ちになること",ex:"話に<b>共感</b>する",jp:"同感"},
  {w:"反省",pos:"はんせい",e:"🪞",def:"自分の行いをふり返ること",ex:"失敗を<b>反省</b>する",jp:"ふり返る"},
  {w:"覚悟",pos:"かくご",e:"😤",def:"つらいことを受け入れる心がまえ",ex:"<b>覚悟</b>を決める",jp:"心がまえ"},
  {w:"貴重",pos:"きちょう",e:"💎",def:"とても大切でまれなこと",ex:"<b>貴重</b>な体験",jp:"大切"},
  {w:"平凡",pos:"へいぼん",e:"😐",def:"ふつうで目立たないこと",ex:"<b>平凡</b>な毎日",jp:"対義：非凡"},
  {w:"立派",pos:"りっぱ",e:"🏆",def:"すぐれていてみごとなこと",ex:"<b>立派</b>な態度",jp:"みごと"},
  {w:"慎重",pos:"しんちょう",e:"🐢",def:"注意ぶかく行うこと",ex:"<b>慎重</b>に進める",jp:"対義：軽率"},
  {w:"積極",pos:"せっきょく",e:"🙋",def:"自分から進んでやること",ex:"<b>積極</b>的に発言する",jp:"対義：消極"},

var known=loadKnown();
var si=0, order=[], idx=0, flipped=false, filterOn=false;

function loadKnown(){try{return JSON.parse(localStorage.getItem('jvocab_known')||'{}')||{};}catch(e){return {};}}
function learnedCount(){return STAGES.reduce(function(n,s){return n+stageKnown(s);},0);}
function writeStats(){try{localStorage.setItem('jvocab_stats',JSON.stringify({learned:learnedCount(),deckSize:TOTAL,goal:GOAL,updated:Date.now()}));}catch(e){}}
function saveKnown(){try{localStorage.setItem('jvocab_known',JSON.stringify(known));}catch(e){}writeStats();}
function stageKnown(s){return s.words.filter(function(c){return known[c.w];}).length;}

function renderHome(){
  var kc=learnedCount();
  document.getElementById('ovCount').textContent=kc;
  document.getElementById('ovFill').style.width=Math.min(100,kc/GOAL*100)+'%';
  document.getElementById('ovPct').textContent=Math.round(kc/GOAL*100)+'%';
  document.getElementById('ovDeck').textContent=TOTAL;
  writeStats();
  var html=STAGES.map(function(s,i){
    var k=stageKnown(s), t=s.words.length, pct=Math.round(k/t*100), clear=(k===t);
    var stars='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
    return '<button class="stage-card" style="--sc:'+s.color+'" onclick="openStage('+i+')">'
      +'<div class="sc-top"><span class="sc-name">'+s.name+'</span><span class="sc-stars">'+stars+'</span></div>'
      +'<div class="sc-sub">'+s.sub+' ・ '+t+'語</div>'
      +'<div class="sc-prog"><span>覚えた '+k+' / '+t+'</span><div class="sc-bar"><div class="sc-fill" style="width:'+pct+'%"></div></div>'
      +(clear?'<span class="sc-clear">クリア！⭐</span>':'<span>'+pct+'%</span>')+'</div>'
      +'</button>';
  }).join('');
  document.getElementById('stageList').innerHTML=html;
}

function openStage(i){si=i;order=STAGES[i].words.map(function(_,n){return n;});idx=0;filterOn=false;
  document.getElementById('home').hidden=true;document.getElementById('study').hidden=false;
  var s=STAGES[i];document.getElementById('study').style.setProperty('--sc',s.color);
  document.getElementById('studyName').textContent=s.name;
  document.getElementById('studyStars').textContent='★'.repeat(s.stars)+'☆'.repeat(5-s.stars);
  render();window.scrollTo(0,0);
}
function showHome(){document.getElementById('study').hidden=true;document.getElementById('home').hidden=false;renderHome();window.scrollTo(0,0);}

function activeOrder(){if(!filterOn)return order;var w=STAGES[si].words;var f=order.filter(function(n){return !known[w[n].w];});return f.length?f:order;}
function curCard(){var o=activeOrder();if(idx>=o.length)idx=0;return STAGES[si].words[o[idx]];}

function render(){
  var w=STAGES[si].words,o=activeOrder();if(idx>=o.length)idx=o.length-1;if(idx<0)idx=0;
  var c=w[o[idx]];
  flipped=false;document.getElementById('inner').classList.remove('flip');
  document.getElementById('fEmoji').textContent=c.e;
  document.getElementById('fWord').textContent=c.w;
  document.getElementById('fPos').textContent=c.pos;
  document.getElementById('bRead').textContent=c.pos;
  document.getElementById('bWord').textContent=c.w;
  document.getElementById('bDef').textContent=c.def;
  document.getElementById('bEx').innerHTML=c.ex;
  document.getElementById('jpBtn').outerHTML='<button id="jpBtn" onclick="toggleJp(event)">ヒントを見る</button>';
  document.getElementById('posLabel').textContent=(idx+1)+' / '+o.length;
  var k=stageKnown(STAGES[si]);
  document.getElementById('knownLabel').textContent='覚えた '+k;
  document.getElementById('fill').style.width=(k/w.length*100)+'%';
  var kb=document.getElementById('knowBtn');
  if(known[c.w]){kb.classList.add('on');kb.textContent='✓ 覚えた！';}else{kb.classList.remove('on');kb.textContent='覚えた！';}
  document.getElementById('filterBtn').style.outline=filterOn?'2px solid '+STAGES[si].color:'none';
}
function flip(){flipped=!flipped;document.getElementById('inner').classList.toggle('flip',flipped);}
function next(){var o=activeOrder();idx=(idx+1)%o.length;render();}
function prev(){var o=activeOrder();idx=(idx-1+o.length)%o.length;render();}
function toggleKnow(){var c=curCard();known[c.w]=!known[c.w];saveKnown();
  var allNow=STAGES[si].words.every(function(d){return known[d.w];});
  render();if(allNow)setTimeout(function(){showDone(STAGES[si].name);},250);}
function toggleFilter(){filterOn=!filterOn;idx=0;render();}
function shuffle(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}idx=0;render();}
function fmtHint(j){return /^(対義|意味|類似|同義|反対)/.test(j)?j:'類似：'+j;}
function toggleJp(ev){ev.stopPropagation();var c=curCard();var en=EN[c.w]?'<span class="word-en">'+EN[c.w]+'</span>':'';document.getElementById('jpBtn').outerHTML='<span class="word-jp" id="jpBtn">💡 '+fmtHint(c.jp)+en+'</span>';}
var enVoice=null;
function pickVoice(){try{if(!('speechSynthesis'in window))return;var vs=window.speechSynthesis.getVoices()||[];if(!vs.length)return;
  enVoice=vs.filter(function(v){return /ja[-_]JP/i.test(v.lang);})[0]
    ||vs.filter(function(v){return /^ja/i.test(v.lang);})[0]
    ||enVoice;}catch(e){}}
try{if('speechSynthesis'in window){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function speakWord(ev){if(ev){ev.stopPropagation();}var c=curCard();
  try{
    if(!('speechSynthesis'in window)){alert('この端末は音声読み上げに対応していません');return;}
    var ss=window.speechSynthesis;ss.cancel();if(ss.paused){try{ss.resume();}catch(e){}}
    if(!enVoice)pickVoice();
    var u=new SpeechSynthesisUtterance(c.pos||c.w);u.lang='ja-JP';u.rate=.95;u.pitch=1;
    if(enVoice)u.voice=enVoice;
    ss.speak(u);
    // some mobile engines stall right after load; nudge with a resume on next tick
    setTimeout(function(){try{if(ss.paused)ss.resume();}catch(e){}},80);
  }catch(e){}}
function showDone(name){var st=document.getElementById('study');if(document.getElementById('doneMsg'))return;var d=document.createElement('div');d.className='done-msg';d.id='doneMsg';d.textContent='🎉 '+name+' クリア！全部覚えたね！';st.insertBefore(d,st.querySelector('.card3d'));setTimeout(function(){if(d)d.remove();},4000);}

renderHome();
</script>
