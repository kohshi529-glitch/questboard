<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>計算クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<script src="./keisan-hw.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* direct cloud sync (case A): push this drill's own progress to rooms/<room>/appstats */
window.QB_APP='keisan';
(function(){
  window.qbSyncKick=function(){};
  var creds=null;try{creds=JSON.parse(localStorage.getItem('qb_sync')||'null');}catch(e){}
  if(!creds||!creds.fb||!creds.fb.databaseURL||!creds.room||!window.firebase)return;
  var db,base;
  try{if(!firebase.apps.length)firebase.initializeApp(creds.fb);db=firebase.database();base='rooms/'+creds.room+'/appstats';}catch(e){return;}
  function num(x){x=+x;return isFinite(x)?x:0;}
  function dnum(d){if(!d)return 0;var p=(''+d).split('-');return num(p[0])*10000+num(p[1])*100+num(p[2]);}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function role(){try{return localStorage.getItem('qb_calc_owner')==='papa'?'papa':'child';}catch(e){return 'child';}}
  function pushVocab(key){var ls=lsGet(key+'_stats');if(!ls)return;
    try{db.ref(base+'/'+key).transaction(function(cur){
      if(!cur)return ls;
      if(num(ls.learned)>num(cur.learned))return ls;
      if(num(ls.learned)===num(cur.learned)&&num(ls.updated)>=num(cur.updated))return ls;
      return cur;
    },function(){},false);}catch(e){}}
  function kEp(r){try{return +(localStorage.getItem('qb_kep_'+r)||0)||0;}catch(e){return 0;}}
  function pushKeisan(){var ls=lsGet('keisan_stats');if(!ls)return;var r=role(),adopt=null;
    try{db.ref(base+'/'+r).transaction(function(cur){
      adopt=null;
      /* クラウドの記録が復元された（版が新しい）ときは、この端末の記録で上書きせず、クラウドの記録に入れ替える */
      if(cur&&+(cur.ep||0)>kEp(r)){adopt={k:cur.keisan||null,ep:+cur.ep};return;}
      cur=cur||{};var del=cur.del||{},ck=cur.keisan||{},best={},k,cb=ck.best||{},lb=ls.best||{};
      for(k in cb)best[k]=cb[k];
      for(k in lb)best[k]=(best[k]==null)?lb[k]:Math.min(best[k],lb[k]);
      var dc=dnum(ck.date),dl=dnum(ls.date),m={best:best};
      if(dc===dl){m.date=ck.date||ls.date;m.today=Math.max(num(ck.today),num(ls.today));m.lastAcc=Math.max(num(ck.lastAcc),num(ls.lastAcc));}
      else if(dc>dl){m.date=ck.date;m.today=num(ck.today);m.lastAcc=ck.lastAcc;}
      else{m.date=ls.date;m.today=num(ls.today);m.lastAcc=ls.lastAcc;}
      m.ts=Math.max(num(ck.ts),num(ls.ts));
      var pc=ck.perf,pl=ls.perf,dpc=dnum(pc&&pc.d),dpl=dnum(pl&&pl.d);
      if(pc||pl){if(dpc===dpl){var pm={},pk,a1=(pc&&pc.m)||{},a2=(pl&&pl.m)||{};for(pk in a1)pm[pk]=a1[pk];for(pk in a2)pm[pk]=Math.max(num(pm[pk]),num(a2[pk]));m.perf={d:(pc||pl).d,m:pm};}else m.perf=(dpc>dpl)?pc:pl;}
      var fb={};for(k in m.best){if(del[k]!=null&&m.best[k]===del[k])continue;fb[k]=m.best[k];}m.best=fb;
      var bc=ck.pbs,bl2=ls.pbs,dbc=dnum(bc&&bc.d),dbl=dnum(bl2&&bl2.d);if(bc||bl2){if(dbc===dbl){var kk={},q1;for(q1 in ((bc&&bc.k)||{}))kk[q1]=1;for(q1 in ((bl2&&bl2.k)||{}))kk[q1]=1;m.pbs={d:(bc||bl2).d,n:Math.max(num(bc&&bc.n),num(bl2&&bl2.n)),k:kk};}else m.pbs=(dbc>dbl)?bc:bl2;}
      var hm=mergeHistK(ck.hist,ls.hist);if(hm)m.hist=hm;var pm2=mergePbl(ck.pbl,ls.pbl);if(pm2)m.pbl=pm2;
      cur.keisan=m;return cur;
    },function(){if(!adopt)return;try{localStorage.setItem('keisan_stats',JSON.stringify(adopt.k));localStorage.setItem('qb_kep_'+r,String(adopt.ep));}catch(e){}
      try{if(typeof loadStats==='function')stats=loadStats();if(typeof renderHome==='function')renderHome();}catch(e){}},false);}catch(e){}}
  /* がんばり記録：日ごとの記録 hist={日付:{q:正解した問題数,s:セット数,f:全問正解セット,b:ベスト更新}}（項目ごとに大きい方）、ベスト更新の履歴 pbl={時刻:[種目,秒,前の秒]}（和集合） */
  function mergeHistK(a,b){if(!a&&!b)return null;var o={},d,f;a=a||{};b=b||{};
    for(d in a)o[d]=a[d];for(d in b){if(!o[d]){o[d]=b[d];continue;}var x=o[d]||{},y=b[d]||{},z={};for(f in x)z[f]=num(x[f]);for(f in y)z[f]=Math.max(num(z[f]),num(y[f]));o[d]=z;}
    var ks=Object.keys(o).sort(function(p,q){return dnum(p)-dnum(q);});while(ks.length>400)delete o[ks.shift()];return o;}
  function mergePbl(a,b){if(!a&&!b)return null;var o={},k;a=a||{};b=b||{};for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];
    var ks=Object.keys(o).sort(function(p,q){return num(p)-num(q);});while(ks.length>500)delete o[ks.shift()];return o;}
  function doPush(){if(window.QB_APP==='keisan')pushKeisan();else pushVocab(window.QB_APP);}
  var t=null;
  window.qbSyncKick=function(){clearTimeout(t);t=setTimeout(doPush,700);};
  document.addEventListener('visibilitychange',function(){if(document.hidden)doPush();});
  window.addEventListener('pagehide',doPush);
  doPush();
})();
</script>
<style>
  :root{
    --bg:#eef2f8; --card:#ffffff; --card2:#f7f9fc;
    --ink:#1f2740; --ink-soft:#56607a; --ink-faint:#8891a6;
    --line:#dfe5ef; --line2:#cdd5e3;
    --accent:#3b6fe0; --accent-d:#2f5bc0; --accent-soft:#e6edfc;
    --warm:#f08a2c; --warm-soft:#fde9d4;
    --good:#2f9e5e; --good-soft:#e2f3e9; --good-flash:#c9efd6;
    --bad:#e2574f; --bad-soft:#fbe4e2;
    --shadow:0 2px 4px rgba(31,39,64,.06),0 10px 26px rgba(31,39,64,.10);
    --disp:"Fredoka","Nunito",system-ui,sans-serif;
    --body:"Nunito",system-ui,-apple-system,sans-serif;
    --jp:"Noto Sans JP",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#121620; --card:#1d2330; --card2:#242b3a;
      --ink:#eef1f8; --ink-soft:#b6bfd2; --ink-faint:#868fa6;
      --line:#2f3646; --line2:#3b4456;
      --accent:#6f97f0; --accent-d:#8aabf5; --accent-soft:#232d45;
      --warm:#f3a65c; --warm-soft:#33281a;
      --good:#6fcf90; --good-soft:#1d3326; --good-flash:#24402f;
      --bad:#f0837c; --bad-soft:#3a211f;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#121620; --card:#1d2330; --card2:#242b3a;
    --ink:#eef1f8; --ink-soft:#b6bfd2; --ink-faint:#868fa6;
    --line:#2f3646; --line2:#3b4456;
    --accent:#6f97f0; --accent-d:#8aabf5; --accent-soft:#232d45;
    --warm:#f3a65c; --warm-soft:#33281a;
    --good:#6fcf90; --good-soft:#1d3326; --good-flash:#24402f;
    --bad:#f0837c; --bad-soft:#3a211f;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;touch-action:manipulation}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding-block:18px 24px;padding-left:16px;padding-right:16px;min-height:100%;display:flex;flex-direction:column}
  .toboard{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-family:var(--jp);font-weight:800;font-size:13px;color:var(--accent-d);background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:var(--shadow);margin-bottom:4px}
  .toboard:active{transform:translateY(1px)}
  header{text-align:center;margin-bottom:8px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:800;margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:2px 0 0;color:var(--ink)}
  /* content is centered as a block; cards sized to their content, NOT stretched */
  #home{flex:1;display:flex;flex-direction:column;justify-content:center}

  /* home */
  .diffrow{display:flex;gap:10px;justify-content:center;margin:0 0 10px}
  .diff{flex:1;max-width:130px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:14px;padding:14px 10px;font-family:var(--body);font-weight:800;font-size:16px;cursor:pointer}
  .diff.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stat-strip{display:flex;gap:10px;justify-content:center;margin:0 0 16px;font-size:14px;color:var(--ink-soft);font-weight:800}
  .stat-strip .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;box-shadow:var(--shadow)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mode{min-height:148px;border:1px solid var(--line);border-left:7px solid var(--mc);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;text-align:left;font-family:var(--body);display:flex;flex-direction:column;justify-content:center;gap:4px}
  .mode:active{transform:translateY(1px)}
  .mode .mi{font-size:48px;line-height:1}
  .mode .mn{font-family:var(--disp);font-weight:700;font-size:26px;margin-top:8px;color:var(--ink)}
  .mode .mb{font-size:13.5px;color:var(--ink-faint);font-weight:800;margin-top:2px}
  .mode.wide{grid-column:1 / -1;min-height:88px;border-left-color:var(--warm);flex-direction:row;align-items:center;gap:16px}
  .mode.wide .mi{font-size:46px}
  .mode.wide .mn{margin-top:0}
  .home-tip{text-align:center;font-size:13.5px;color:var(--ink-faint);margin-top:18px;line-height:1.6}

  /* play */
  #play{flex:1;display:flex;flex-direction:column}
  .playmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3.5vh,32px)}
  .pbar{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:var(--ink-soft)}
  .pbar .quit{border:1px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:10px;padding:8px 13px;font-family:var(--body);font-weight:800;font-size:13px;cursor:pointer}
  .pbar .timer{margin-left:auto;font-family:var(--disp);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
  .track{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 0}
  .track .f{height:100%;background:linear-gradient(90deg,var(--accent),var(--warm));width:0%;transition:width .25s}
  .qbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .q{font-family:var(--disp);font-weight:700;font-size:clamp(46px,13vw,74px);color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ans{min-width:180px;min-height:84px;padding:8px 28px;border:3px solid var(--line2);border-radius:18px;background:var(--card);font-family:var(--disp);font-weight:700;font-size:clamp(46px,8vw,68px);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .ans.ok{border-color:var(--good);background:var(--good-flash)}
  .ans.ng{border-color:var(--bad);background:var(--bad-soft)}
  .ngmsg{min-height:22px;font-size:15px;font-weight:800;color:var(--bad)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,clamp(62px,10.5vh,92px));gap:12px}
  .key{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:38px;cursor:pointer;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .key:active{transform:translateY(2px)}
  .key.del{color:var(--bad);font-size:22px;font-family:var(--body);font-weight:800}
  .key.go{background:var(--accent);color:#fff;font-size:22px;font-family:var(--body);font-weight:800;border-color:var(--accent)}

  /* result */
  #result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
  .r-emoji{font-size:64px}
  .r-title{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--ink)}
  .r-best{font-size:14px;font-weight:800;color:var(--warm);margin-top:2px}
  .r-commit{font-size:13px;font-weight:800;color:var(--good);margin-top:6px;line-height:1.5}
  .r-grid{display:flex;gap:12px;margin:18px 0 6px;flex-wrap:wrap;justify-content:center}
  .r-tile{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 20px;min-width:110px}
  .r-tile .rk{font-size:12px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}
  .r-tile .rv{font-family:var(--disp);font-weight:700;font-size:28px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
  .r-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
  .btn{border:none;border-radius:14px;padding:15px 22px;font-family:var(--body);font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
  .btn.prim{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
  .btn:active{transform:translateY(2px)}

  /* 入力のえらび（タップ／手書き） */
  .inrow{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
  .inp{border:1.5px solid var(--line2);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:9px 16px;font-family:var(--jp);font-weight:800;font-size:14px;cursor:pointer}
  .inp.on{background:var(--warm);border-color:var(--warm);color:#fff}
  /* 手書き */
  .hwbox{display:flex;flex-direction:column;gap:10px}
  .hwwrap{position:relative;border:2.5px dashed var(--line2);border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  #hwc{display:block;width:100%;height:clamp(170px,28vh,270px);touch-action:none;cursor:crosshair}
  .hwhint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--jp);font-weight:700;font-size:15px;color:var(--ink-faint);pointer-events:none;line-height:1.6}
  .hwbtns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
  .hwbtns .key{height:clamp(54px,8vh,70px);font-size:17px;white-space:nowrap}
  #play.hw .playmid{gap:clamp(10px,2vh,20px)}
  #play.hw .qbox{gap:12px}
  #play.hw .ans{min-height:76px}
  .ans .dq{color:var(--warm);text-decoration:underline wavy;text-underline-offset:6px;text-decoration-thickness:2px}
  .hwnote{text-align:center;font-size:12.5px;color:var(--ink-faint);font-weight:800;min-height:18px}
  /* 🎤 声で答える（2026-11-28） */
  .vbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 10px}
  .vmic{border:none;border-radius:999px;padding:10px 18px;font-family:var(--jp);font-weight:800;font-size:15px;background:var(--card);color:var(--ink-soft);border:2px solid var(--line2);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .vmic.on{background:#fff0f0;border-color:#e2574f;color:#c0392b}
  .vmic.on .vdot{width:11px;height:11px;border-radius:50%;background:#e2574f;animation:vpulse 1s ease-in-out infinite}
  @keyframes vpulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
  .vtxt{min-height:20px;font-size:13.5px;font-weight:800;color:var(--ink-faint);text-align:center;font-family:var(--jp)}
  #play.voice .pad{grid-template-rows:repeat(4,clamp(48px,7.6vh,72px))}
  #play.voice .key:not(.del):not(.go){font-size:30px}
  #play.voice .qbox{gap:12px}
  /* 📝 ノート（筆算） */
  #play.note .q{font-size:clamp(30px,9vw,44px)}
  #play.note .playmid{justify-content:flex-start;gap:12px;margin-top:10px}
  .notebox{display:flex;flex-direction:column;gap:10px}
  .nnote{background:var(--card);border:1.5px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:10px 8px 14px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
  #ngrid{display:flex;flex-direction:column;align-items:center;gap:4px;--cw:58px}
  #ngrid.shake{animation:nshake .35s}
  @keyframes nshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #ngrid.okflash .na.fix{background:var(--good-flash);border-color:var(--good)}
  .nrow{display:flex;gap:6px}
  .nc{width:var(--cw);height:calc(var(--cw)*1.08);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:calc(var(--cw)*.72);color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
  .nc.op{color:var(--ink-soft)}
  .plrow .nc{height:18px;font-family:var(--jp);font-size:12px;color:var(--ink-faint);font-weight:800}
  .plrow .nc.now{color:var(--accent-d)}
  .nc.dg.cross{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--warm);text-decoration-thickness:3px}
  .bwrow .nc{height:calc(var(--cw)*.6)}
  .nc.bwc{border:2px dashed var(--line2);border-radius:10px;font-size:calc(var(--cw)*.42);color:var(--warm)}
  .nc.bwc.none{border:none}
  .nc.bwc.has{border-style:solid;border-color:var(--warm);background:var(--warm-soft)}
  .brow{border-bottom:3.5px solid var(--ink);padding-bottom:4px;margin-bottom:4px}
  .nc.na{border:2.5px dashed var(--line2);border-radius:12px;background:var(--card)}
  .nc.na.none{border:none;background:none}
  .nc.na.now{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px var(--accent-soft)}
  .nc.na.fix{border-style:solid;border-color:var(--line2)}
  .nc.na.fix .big{color:var(--accent-d)}
  .nc.auto .big,.nc.bwc.auto{color:var(--bad)!important}
  .nc.na .sm{position:absolute;left:4px;top:1px;font-size:calc(var(--cw)*.36);color:var(--warm);line-height:1}
  .nc .sm.badv{left:auto;right:3px;top:auto;bottom:1px;color:var(--bad);text-decoration:line-through;position:absolute;font-size:calc(var(--cw)*.36);line-height:1}
  .nc.badc{border-color:var(--bad)!important;background:var(--bad-soft)!important}
  [data-drop].over{border-color:var(--warm)!important;background:var(--warm-soft)!important}
  .nmsg{text-align:center;font-family:var(--jp);font-size:14px;font-weight:800;color:var(--ink-soft);min-height:40px;line-height:1.45}
  .nmsg .ng{color:var(--bad)} .nmsg .ok{color:var(--good)}
  .nkeys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;touch-action:none}
  .nkey{height:clamp(52px,8vh,64px);border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:14px;font-family:var(--disp);font-weight:700;font-size:30px;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  .nkey.sel{background:var(--warm);color:#fff;border-color:var(--warm)}
  .nbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
  .nbtns .key{height:52px;font-size:16px}
  .nbtns .key:disabled{opacity:.4}

<script>
const SETSIZE=20;
const MODE_NAME={add:"たし算",sub:"ひき算",mul:"かけ算",div:"わり算",mix:"ミックス"};
var diff=1, mode='add', problems=[], pi=0, correct=0, cur="", t0=0, timerId=null, locked=false, SZ=SETSIZE;
var stats=loadStats();
var inMode=(function(){try{var v=localStorage.getItem('keisan_input');return (v==='hw'||v==='note'||v==='voice')?v:'tap';}catch(e){return 'tap';}})();
/* ベスト記録のキー：手書きは別に記録（例 add1h）。タップより時間がかかるので、くらべないため */
/* 声で答える（v）も、タップとは別に記録する */
function bkey(m){return m+diff+(inMode==='hw'?'h':inMode==='note'?'n':inMode==='voice'?'v':'');}
function setInput(i){if(i==='voice'&&!vSR()){alert('この端末・ブラウザでは 声の入力が使えないみたい。\nGalaxy の Chrome などで ためしてね（タップ・手書きは そのまま使えるよ）');return;}
  inMode=(i==='hw'||i==='note'||i==='voice')?i:'tap';try{localStorage.setItem('keisan_input',inMode);}catch(e){}renderHome();}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function loadStats(){var s;try{s=JSON.parse(localStorage.getItem('keisan_stats')||'null');}catch(e){}if(!s||typeof s!=='object')s={};if(s.date!==todayStr()){s.date=todayStr();s.today=0;}s.best=s.best||{};s.hist=s.hist||{};
  var _d=todayStr(),_h=s.hist[_d];if(s.today>0||(s.pbs&&s.pbs.d===_d)||(s.perf&&s.perf.d===_d)){_h=_h||{q:0,s:0,f:0,b:0};_h.q=Math.max(_h.q||0,s.today||0);if(s.pbs&&s.pbs.d===_d)_h.b=Math.max(_h.b||0,s.pbs.n||0);if(s.perf&&s.perf.d===_d){var _nf=Object.keys(s.perf.m||{}).length;_h.f=Math.max(_h.f||0,_nf);_h.s=Math.max(_h.s||0,_h.f);}s.hist[_d]=_h;}
  return s;}
/* がんばり記録（日ごと） */
function histDay(){var d=todayStr();stats.hist=stats.hist||{};var h=stats.hist[d];if(!h){h=stats.hist[d]={q:0,s:0,f:0,b:0};var ks=Object.keys(stats.hist);if(ks.length>400){ks.sort(function(a,b){var p=a.split('-'),q=b.split('-');return (p[0]*1e4+p[1]*100+ +p[2])-(q[0]*1e4+q[1]*100+ +q[2]);});while(ks.length>400)delete stats.hist[ks.shift()];}}return h;}
function saveStats(){stats.ts=Date.now();try{localStorage.setItem('keisan_stats',JSON.stringify(stats));}catch(e){}if(window.qbSyncKick)qbSyncKick();}

/* 1日のコミットライン：たし・ひき・かけ・わり・ミックスを各1回以上 全問正解（難易度の条件はクエストボードの保護者メニュー） */
function calcNeed(){var c={};try{c=(JSON.parse(localStorage.getItem('questboard_v3')||'{}')||{}).cfg||{};}catch(e){}var d=parseInt(c.calcDiff,10);return (d>=0&&d<=2)?d+1:1;}
function perfToday(){return (stats.perf&&stats.perf.d===todayStr())?(stats.perf.m||{}):{};}
function modeDone(m){return (perfToday()[m]||0)>=calcNeed();}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function genOne(m){
  var a,b,op,ans;
  if(m==='mix')m=['add','sub','mul','div'][rnd(0,3)];
  if(m==='add'){var mx=[20,100,999][diff];a=rnd(diff===2?10:1,mx);b=rnd(diff===2?10:1,mx);op='+';ans=a+b;}
  else if(m==='sub'){var mx2=[20,100,999][diff];a=rnd(diff===2?10:2,mx2);b=rnd(1,a);op='−';ans=a-b;}
  else if(m==='mul'){if(diff===0){a=rnd(1,5);b=rnd(1,5);}else if(diff===1){a=rnd(2,9);b=rnd(2,9);}else{a=rnd(11,99);b=rnd(2,9);}op='×';ans=a*b;}
  else{var dv,q;if(diff===0){dv=rnd(2,5);q=rnd(1,5);}else if(diff===1){dv=rnd(2,9);q=rnd(2,9);}else{dv=rnd(2,9);q=rnd(11,99);}a=dv*q;b=dv;op='÷';ans=q;}
  return {text:a+' '+op+' '+b+' =',ans:ans};
}
function buildSet(){problems=[];SZ=(inMode==='note')?NOTE_SET:SETSIZE;for(var i=0;i<SZ;i++)problems.push(inMode==='note'?noteGen(mode):genOne(mode));}

function setDiff(d){diff=d;document.querySelectorAll('.diff').forEach(function(b){b.classList.toggle('on',+b.dataset.d===d);});}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtBest(sec){return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}

function renderHome(){
  stats=loadStats();
  document.getElementById('todayN').textContent=stats.today||0;
  document.getElementById('setN').textContent=(inMode==='note')?NOTE_SET:SETSIZE;
  ['add','sub','mul','div','mix'].forEach(function(m){
    var el=document.getElementById('best'+m);if(!el)return;
    var key=bkey(m);var bv=stats.best[key];
    if(m==='mix'){el.textContent=bv?('ベスト '+fmtBest(bv)):'ぜんぶまぜて タイムアタック！';}
    else el.textContent=bv?('ベスト '+fmtBest(bv)):'ベスト —';
    if(modeDone(m))el.textContent='✅ '+el.textContent;
  });
  var cn=document.getElementById('commitN');if(cn)cn.textContent=['add','sub','mul','div','mix'].filter(modeDone).length;
  document.querySelectorAll('.inp').forEach(function(b){b.classList.toggle('on',b.dataset.i===inMode);});
  ['mul','div'].forEach(function(m){var b=document.getElementById('best'+m);if(b&&b.parentElement){b.parentElement.classList.toggle('off',inMode==='note');if(inMode==='note')b.textContent='ノートは たし・ひき だけ';}});
  var bm=document.getElementById('bestmix');if(bm&&inMode==='note'&&!stats.best[bkey('mix')])bm.textContent='たし算・ひき算を まぜて筆算';
  var tip=document.querySelector('.home-tip');if(tip){if(!tip.dataset.base)tip.dataset.base=tip.innerHTML;tip.innerHTML=(inMode==='voice')?'🎤 問題が出たら、答えの数を 声で言ってね（例：「ごじゅうろく」「56」）。<br>正しい数が聞こえたら すぐ つぎへ。声がうまく通じないときは キーでも答えられるよ。<br>声のベストは タップとは べつに記録するよ（はじめての記録は「記録づくり」）':tip.dataset.base;}
}
function show(id){['home','play','result'].forEach(function(v){document.getElementById(v).hidden=(v!==id);});}

function start(m){if(inMode==='note'&&(m==='mul'||m==='div')){alert('ノート（筆算）は たし算・ひき算・ミックス です');return;}mode=m;buildSet();pi=0;correct=0;cur="";locked=false;
  show('play');document.getElementById('h1').textContent=MODE_NAME[m]+(inMode==='hw'?' ✍️':inMode==='note'?' 📝':inMode==='voice'?' 🎤':' ⚡');
  document.querySelector('.pad').hidden=(inMode!=='tap'&&inMode!=='voice');
  document.getElementById('play').classList.toggle('voice',inMode==='voice');document.getElementById('vbox').hidden=(inMode!=='voice');if(inMode==='voice'){V.want=true;V.denied=false;}else vStop();document.getElementById('play').classList.toggle('hw',inMode==='hw');document.getElementById('hwbox').hidden=(inMode!=='hw');
  document.getElementById('play').classList.toggle('note',inMode==='note');document.getElementById('notebox').hidden=(inMode!=='note');document.getElementById('ans').hidden=(inMode==='note');document.getElementById('ngmsg').hidden=(inMode==='note');
  if(inMode==='hw')hwSize();
  t0=Date.now();if(timerId)clearInterval(timerId);timerId=setInterval(tick,200);tick();
  showProblem();window.scrollTo(0,0);
}
function tick(){document.getElementById('timer').textContent=fmt(Date.now()-t0);}
function showProblem(){
  cur="";locked=false;
  var a=document.getElementById('ans');a.className='ans';a.innerHTML='&nbsp;';
  document.getElementById('ngmsg').textContent='';
  if(inMode==='hw')hwClear();
  document.getElementById('q').textContent=problems[pi].text;
  document.getElementById('qnum').textContent=(pi+1)+' / '+SZ;
  document.getElementById('track').style.width=(pi/SZ*100)+'%';
  if(inMode==='note')setupFromProblem();
  if(inMode==='voice'){var vt=document.getElementById('vtxt');if(vt&&!V.denied)vt.textContent='';vListen();}
}
function press(n){if(locked||(inMode!=='tap'&&inMode!=='voice'))return;if(cur.length>=6)return;cur+=n;paint();}
function del(){if(locked)return;cur=cur.slice(0,-1);paint();}
function paint(){var a=document.getElementById('ans');
  if(inMode==='hw'&&HW.res.length){a.innerHTML=HW.res.slice(0,6).map(function(r){return r.p<0.6?'<span class="dq">'+r.d+'</span>':String(r.d);}).join('');return;}
  a.textContent=cur===""?'':cur;if(cur==='')a.innerHTML='&nbsp;';}

/* ---- ✍️ 手書きモード（keisan-hw.js で 端末の中だけで読み取る） ---- */
var HW={strokes:[],cur:null,pid:null,res:[]};
function hwC(){return document.getElementById('hwc');}
function hwSize(){var c=hwC(),r=window.devicePixelRatio||1;var w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;c.width=Math.round(w*r);c.height=Math.round(h*r);hwDraw();}
function hwPt(e){var r=hwC().getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function hwDraw(){var c=hwC(),g=c.getContext('2d'),r=window.devicePixelRatio||1,cs=getComputedStyle(document.documentElement);
  g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,c.width,c.height);
  var W=c.clientWidth,H=c.clientHeight;
  /* 書く高さの目安（うすい2本線） */
  g.strokeStyle=cs.getPropertyValue('--line').trim()||'#dfe5ef';g.lineWidth=1.5;g.setLineDash([6,6]);
  g.beginPath();g.moveTo(12,H*0.16);g.lineTo(W-12,H*0.16);g.moveTo(12,H*0.84);g.lineTo(W-12,H*0.84);g.stroke();g.setLineDash([]);
  /* 読み取った1字ずつのわくと数字 */
  var acc=cs.getPropertyValue('--accent').trim()||'#3b6fe0',warm=cs.getPropertyValue('--warm').trim()||'#f08a2c';
  HW.res.forEach(function(q){var b=q.b,pd=8,col=q.p<0.6?warm:acc;g.strokeStyle=col;g.globalAlpha=.45;g.lineWidth=1.5;g.setLineDash([4,4]);
    g.strokeRect(b[0]-pd,b[1]-pd,b[2]-b[0]+pd*2,b[3]-b[1]+pd*2);g.setLineDash([]);g.globalAlpha=1;
    g.fillStyle=col;g.font='800 16px Nunito,system-ui,sans-serif';g.fillText(String(q.d),b[0]-pd+3,b[1]-pd-4<14?b[3]+pd+16:b[1]-pd-4);});
  g.strokeStyle=cs.getPropertyValue('--ink').trim()||'#1f2740';g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(5,H*0.028);
  HW.strokes.forEach(function(st){g.beginPath();st.forEach(function(p,i){if(i)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);});if(st.length===1)g.lineTo(st[0][0]+.1,st[0][1]);g.stroke();});}
function hwRead(){
  if(!window.KHW){document.getElementById('hwnote').textContent='読み取りの準備中…もう一度書いてね';return;}
  HW.res=HW.strokes.length?KHW.read(HW.strokes,hwC().clientHeight):[];
  cur=HW.res.slice(0,6).map(function(r){return r.d;}).join('');
  document.getElementById('hwnote').textContent=HW.res.some(function(r){return r.p<0.6;})?'オレンジの数字は 読み取りが あやしいよ。ちがったら「1字けす」で書き直してね':'';
  paint();hwDraw();}
function hwClear(){HW.strokes=[];HW.res=[];HW.cur=null;HW.pid=null;cur='';var h=document.getElementById('hwhint');if(h)h.hidden=(pi>0);
  document.getElementById('hwnote').textContent='';paint();if(hwC().width)hwDraw();}
function hwUndo(){if(locked)return;
  if(HW.res.length){var last=HW.res[HW.res.length-1].s;HW.strokes=HW.strokes.filter(function(st){return last.indexOf(st)<0;});}
  else HW.strokes.pop();
  if(!HW.strokes.length){hwClear();return;}hwRead();}
(function(){var c=hwC();if(!c)return;
  c.addEventListener('pointerdown',function(e){if(locked||HW.pid!==null)return;e.preventDefault();HW.pid=e.pointerId;try{c.setPointerCapture(e.pointerId);}catch(x){}
    HW.cur=[hwPt(e)];HW.strokes.push(HW.cur);document.getElementById('hwhint').hidden=true;hwDraw();});
  c.addEventListener('pointermove',function(e){if(e.pointerId!==HW.pid||!HW.cur)return;e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];if(!evs.length)evs=[e];
    var g=c.getContext('2d'),last=HW.cur[HW.cur.length-1];g.beginPath();g.moveTo(last[0],last[1]);
    evs.forEach(function(ev){var p=hwPt(ev);HW.cur.push(p);g.lineTo(p[0],p[1]);});g.stroke();});
  function up(e){if(e.pointerId!==HW.pid)return;HW.pid=null;HW.cur=null;hwRead();}
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  window.addEventListener('resize',function(){if(inMode==='hw'&&!document.getElementById('play').hidden)hwSize();});
})();
function submit(){
  if(locked||cur==="")return;locked=true;
  var a=document.getElementById('ans');
  if(parseInt(cur,10)===problems[pi].ans){
    a.classList.add('ok');correct++;stats.today=(stats.today||0)+1;var _hq=histDay();_hq.q=Math.max((_hq.q||0)+1,stats.today);saveStats();
    setTimeout(nextProblem,320);
  }else{
    a.classList.add('ng');
    document.getElementById('ngmsg').textContent='せいかい：'+problems[pi].ans;
    setTimeout(nextProblem,1100);
  }
}
function nextProblem(){pi++;if(pi>=SZ){finish();}else{showProblem();}}
function finish(){
  if(timerId)clearInterval(timerId);vStop();
  var ms=Date.now()-t0, sec=Math.round(ms/1000), acc=Math.round(correct/SZ*100),isNote=(inMode==='note');
  var key=bkey(mode), prevBest=stats.best[key], isBest=false, hwFirst=false;
  if(correct===SZ){ if(!prevBest||sec<prevBest){stats.best[key]=sec;isBest=true;} }
  /* 手書きの はじめての記録は「記録づくり」。ベスト更新のごほうびは 2回目から */
  if(isBest&&(inMode==='hw'||inMode==='voice')&&!prevBest){isBest=false;hwFirst=true;}
  /* ベスト更新のボーナスは、その日・その種目（例：たし算・ふつう）で1回だけ。タップと手書きのどちらで更新しても同じ */
  var kind=mode+diff,pbDup=false;
  /* ノート（筆算）は 練習用：ベストは記録するが ボーナス・コミットラインには数えない */
  if(isBest&&!isNote){var _pd=todayStr();if(!stats.pbs||stats.pbs.d!==_pd)stats.pbs={d:_pd,n:0,k:{}};stats.pbs.k=stats.pbs.k||{};
    if(stats.pbs.k[kind])pbDup=true;else{stats.pbs.k[kind]=1;stats.pbs.n=(stats.pbs.n||0)+1;}}

/* ---- 🎤 声で答えるモード（2026-11-28 娘の要望）----
   端末の音声認識（Chrome の webkitSpeechRecognition・日本語）で、言った数を読み取る。
   正しい数が聞こえたら その場で正解。ちがう数が はっきり聞こえたら まちがい。数が聞き取れないときは もう一度きく。
   タップのキーも そのまま使える（声がうまくいかないとき用）。 */
var V={rec:null,active:false,want:false,denied:false,len:0,skip:0,mi:-1,ml:0,t:null};

  l.textContent=on?'きいてるよ… 答えを 声で言ってね':(V.denied?'🎤 マイクが使えないよ（タップで答えてね）':'🎤 マイクをオンにする');}

function vToggle(){if(V.active&&V.want){vStop();vUI();return;}V.want=true;V.denied=false;vListen();}

  if(!V.rec){var r=V.rec=new SR();r.lang='ja-JP';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
    r.onstart=function(){V.active=true;V.len=0;V.skip=0;V.mi=-1;V.ml=0;vUI();};
    r.onresult=vOnResult;
    r.onerror=function(e){var er=e&&e.error;if(er==='not-allowed'||er==='service-not-allowed'||er==='audio-capture'){V.want=false;V.denied=true;vSay(er==='audio-capture'?'マイクが見つからないよ':'マイクの使用が許可されていないよ。ブラウザの設定でマイクを「許可」にしてね');}
      else if(er==='network'){vSay('ネットにつながらないと 声の入力は使えないよ');}vUI();};
    r.onend=function(){V.active=false;vUI();if(V.want){clearTimeout(V.t);V.t=setTimeout(vListen,150);}};}

function vOnResult(e){var rs=e.results;V.len=rs.length;if(locked||document.getElementById('play').hidden)return;var p=problems[pi];if(!p)return;
  /* すでに使った部分（前の問題の答え）は読まない：skip より前の結果は無視、mark の結果は 使った文字数より後ろだけ読む */
  function txt(i,a){var t=(rs[i][a]&&rs[i][a].transcript)||'';return (i===V.mi)?t.slice(V.ml):t;}
  var from=Math.max(e.resultIndex||0,V.skip),shown='',fin=null,finI=-1;
  for(var i=from;i<rs.length;i++){var r=rs[i];
    for(var a=0;a<r.length;a++){var tx=txt(i,a);if(!a&&tx.trim())shown=tx;if(tx&&jaNums(tx).indexOf(p.ans)>=0){vAccept(i,tx,((rs[i][0]&&rs[i][0].transcript)||'').length);return;}}
    if(r.isFinal){var ns=jaNums(txt(i,0));if(!ns.length){for(var b=1;b<r.length;b++){ns=jaNums(txt(i,b));if(ns.length)break;}}if(ns.length){fin=ns[ns.length-1];finI=i;}}}
  if(shown)vSay('🎤「'+shown.trim()+'」');
  if(fin!==null){V.skip=finI+1;V.mi=-1;cur=String(fin).slice(0,6);paint();submit();}
  else{var L=rs.length-1;if(L>=from&&rs[L].isFinal){V.skip=L+1;V.mi=-1;if(shown)vSay('🎤「'+shown.trim()+'」…数が 聞き取れなかったよ。もう一度 言ってね');}}}
function vAccept(i,tx,full){V.skip=i;V.mi=i;V.ml=full||0;cur=String(problems[pi].ans);paint();vSay('🎤「'+String(tx).trim()+'」');submit();}
/* 日本語の数の読み取り：「56」「五十六」「ごじゅうろく」「せんきゅうひゃく…」に対応。答えにある数をぜんぶ返す */
var JA_U=[['ぜろ',0],['れい',0],['まる',0],['いち',1],['いっ',1],['さん',3],['よん',4],['しち',7],['なな',7],['ろく',6],['ろっ',6],['はち',8],['はっ',8],['きゅう',9],['きゅー',9],['に',2],['し',4],['ご',5],['く',9]];
var JA_M=[['じゅう',10],['じゅー',10],['じゅっ',10],['じっ',10],['ひゃく',100],['びゃく',100],['ぴゃく',100],['せん',1000],['ぜん',1000]];
var JA_K={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9},JA_KM={'十':10,'百':100,'千':1000};
var JA_HOMO={'急':9,'級':9,'球':9,'旧':9,'求':9,'救':9,'誤':5,'碁':5,'後':5,'語':5,'午':5,'録':6,'産':3,'参':3,'死':4,'詩':4,'位置':1,'壱':1,'蜂':8,'鉢':8,'似':2,'荷':2,'煮':2,'銃':10,'重':10,'充':10,'自由':10,'百':100,'千':1000,'線':1000,'先':1000,'丸':0,'零':0,'ゼロ':0};
function jaNums(t){t=String(t||'');try{t=t.normalize('NFKC');}catch(e){}
  t=t.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);}).replace(/(\d)\s+(?=\d)/g,'$1|').replace(/[、。．！!？?]/g,'|').replace(/[\s,.]/g,'');
  t=t.replace(/(こたえは|答えは|こたえ|答え|えーと|えっと|ええと|あのー|あの|です|でした|ですか|かな|ください|下さい|だよ|だと|だ|個|こ$)/g,'|');
  var bare=t.replace(/\|/g,'');if(JA_HOMO.hasOwnProperty(bare))return [JA_HOMO[bare]];
  var out=[],tot=0,dg=null,has=false,lastM=1e9,i=0;
  function flush(){if(has)out.push(tot+(dg||0));tot=0;dg=null;has=false;lastM=1e9;}
  function digit(d){if(dg!==null)flush();dg=d;has=true;}
  function mult(m){if(m>=lastM)flush();tot+=(dg===null?1:dg)*m;dg=null;lastM=m;has=true;}
  while(i<t.length){var c=t.charAt(i),m;
    if(/[0-9]/.test(c)){m=t.slice(i).match(/^[0-9]+/)[0];flush();out.push(parseInt(m,10));i+=m.length;continue;}
    if(JA_K.hasOwnProperty(c)){digit(JA_K[c]);i++;continue;}
    if(JA_KM.hasOwnProperty(c)){mult(JA_KM[c]);i++;continue;}
    var hit=null,k;for(k=0;k<JA_M.length;k++){if(t.substr(i,JA_M[k][0].length)===JA_M[k][0]){hit=['m',JA_M[k]];break;}}
    if(!hit){for(k=0;k<JA_U.length;k++){if(t.substr(i,JA_U[k][0].length)===JA_U[k][0]){hit=['u',JA_U[k]];break;}}}
    if(hit){if(hit[0]==='m')mult(hit[1][1]);else digit(hit[1][1]);i+=hit[1][0].length;continue;}
    flush();i++;}
  flush();return out;}

/* ---- 📝 ノート（筆算）モード ----
   上：問題 ／ まん中：筆算のノート ／ 下：数字キー（指でノートへ運ぶ）
   たし算：一の位から。答えの数字はいまの位へ（大きく＝確定）。くり上がりの1は 左となりの位へ（小さく＝仮）。
           仮の1は、その位の答えを運んだときに消えて答えにまとまる。いちばん左の仮の1は最後に自動で確定（正規化）。
   ひき算：たりない位は、左の位の上の小さいマスへ「くり下がったあとの数」を運ぶ（例 72−38 → 十の位の上に 6）。
   まちがった数を運んだら その問題は誤答。正しい筆算を見せて「つぎへ」。 */
var NOTE_SET=20,NT=null;
function ndig(x){return String(x).split('').reverse().map(Number);}
function noteGen(m){
  if(m==='mix')m=['add','sub'][rnd(0,1)];
  var a,b,ok,tries=0;
  do{tries++;
    if(m==='add'){
      if(diff===0){a=rnd(11,89);b=rnd(2,9);}else if(diff===1){a=rnd(15,99);b=rnd(15,99);}else{a=rnd(105,989);b=rnd(105,989);}
      var A=ndig(a),B=ndig(b),c=0,nc=0;for(var i=0;i<Math.max(A.length,B.length);i++){var s=(A[i]||0)+(B[i]||0)+c;c=s>=10?1:0;nc+=c;}
      ok=nc>=(diff===2?2:1);
    }else{
      if(diff===0){a=rnd(21,98);b=rnd(2,9);}else if(diff===1){a=rnd(31,99);b=rnd(12,a-5);}else{a=rnd(201,999);b=rnd(55,a-30);}
      var A2=ndig(a),B2=ndig(b),nb=0;for(var j=0;j<B2.length;j++)if(A2[j]<B2[j])nb++;
      ok=b<a&&nb>=1&&(diff<2||nb>=1);
      if(diff===2&&ok&&tries<40&&Math.random()<0.35&&A2[1]!==0)ok=false; /* 3けたは ときどき 十の位が0（403−158 など）を出す */
      if(diff===2&&!ok&&tries>=40)ok=b<a;
    }
  }while(!ok&&tries<80);
  var op=m==='add'?'+':'−',ans=m==='add'?a+b:a-b;
  return {text:a+' '+op+' '+b+' =',ans:ans,a:a,b:b,op:op,m:m};}
function noteSetup(p){
  var A=ndig(p.a),B=ndig(p.b),R=ndig(p.ans),n=Math.max(A.length,B.length,R.length),c=[0],lent={},bv={},brw={};
  if(p.m==='add'){for(var i=0;i<n;i++){var s=(A[i]||0)+(B[i]||0)+c[i];c[i+1]=s>=10?1:0;}}
  else{var eff=A.slice();for(var j=0;j<A.length;j++){if(eff[j]<(B[j]||0)){brw[j]=1;eff[j]+=10;eff[j+1]-=1;lent[j+1]=1;}}
    Object.keys(lent).forEach(function(k){k=+k;bv[k]=A[k]>=1?A[k]-1:9;});}
  NT={p:p,A:A,B:B,R:R,n:n,c:c,lent:lent,bv:bv,brw:brw,f:{},t:{},bw:{},auto:{},hist:[],bad:null,done:false,sel:null,why:''};}
function noteCur(){for(var i=0;i<NT.R.length;i++)if(NT.f[i]==null)return i;return -1;}
var PLACE=['一','十','百','千'];
function noteRender(){var N=NT;if(!N)return;var el=document.getElementById('ngrid');var cols=N.n,cur=noteCur(),sub=N.p.m==='sub';
  var cw=Math.min(64,Math.floor((Math.min(window.innerWidth,520)-60)/(cols+1)));el.style.setProperty('--cw',cw+'px');
  function row(cls,cells){return '<div class="nrow '+cls+'">'+cells.join('')+'</div>';}
  var h='',i,cs;
  /* 位の名前 */
  cs=['<div class="nc op"></div>'];for(i=cols-1;i>=0;i--)cs.push('<div class="nc pl'+(i===cur&&!N.done&&!N.bad?' now':'')+'">'+(PLACE[i]?PLACE[i]+'の位':'')+'</div>');h+=row('plrow',cs);
  /* ひき算：くり下がりのマス */
  if(sub){cs=['<div class="nc op"></div>'];for(i=cols-1;i>=0;i--){var can=i>=1&&i<N.A.length,v=N.bw[i];
      cs.push(can?'<div class="nc bwc'+(v!=null?' has':'')+(N.auto['b'+i]?' auto':'')+'" data-drop="b'+i+'">'+(v!=null?v:'')+(N.bad&&N.bad.k==='b'&&N.bad.j===i?'<span class="sm badv">'+N.bad.d+'</span>':'')+'</div>':'<div class="nc bwc none"></div>');}
    h+=row('bwrow',cs);}
  /* 上の数 */
  cs=['<div class="nc op"></div>'];for(i=cols-1;i>=0;i--)cs.push('<div class="nc dg'+(sub&&N.bw[i]!=null?' cross':'')+'">'+(N.A[i]!=null?N.A[i]:'')+'</div>');h+=row('',cs);
  /* 下の数 */
  cs=['<div class="nc op">'+N.p.op+'</div>'];for(i=cols-1;i>=0;i--)cs.push('<div class="nc dg">'+(N.B[i]!=null?N.B[i]:'')+'</div>');h+=row('brow',cs);
  /* 答え */
  cs=['<div class="nc op"></div>'];for(i=cols-1;i>=0;i--){var inR=i<N.R.length,fv=N.f[i],tv=N.t[i],cls='nc na';
      if(!inR){cs.push('<div class="nc na none"></div>');continue;}
      if(fv!=null)cls+=' fix'+(N.auto['f'+i]?' auto':'');else if(i===cur&&!N.done&&!N.bad)cls+=' now';
      if(N.bad&&N.bad.j===i&&N.bad.k==='f')cls+=' badc';
      var inner=fv!=null?'<span class="big">'+fv+'</span>':(tv!=null?'<span class="sm">'+tv+'</span>':'');
      if(N.bad&&N.bad.j===i&&(N.bad.k==='f'||N.bad.k==='t'))inner+='<span class="sm badv">'+N.bad.d+'</span>';
      cs.push('<div class="'+cls+'" data-drop="f'+i+'">'+inner+'</div>');}
  h+=row('arow',cs);
  el.innerHTML=h;
  var msg=document.getElementById('nmsg');
  if(N.bad)msg.innerHTML='<span class="ng">✖ '+N.why+'</span>';
  else if(N.done)msg.innerHTML='<span class="ok">⭕ せいかい！ '+N.p.ans+'</span>';
  else if(cur>=0)msg.textContent=(PLACE[cur]||'')+'の位 を計算して、数字をノートへ運ぼう'+(N.sel!=null?'（'+N.sel+' をえらび中：マスをタップ）':'');
  document.getElementById('nnext').hidden=!N.bad;
  document.getElementById('nundo').disabled=!N.hist.length||N.done||!!N.bad;
  document.querySelectorAll('.nkey').forEach(function(k){k.classList.toggle('sel',N.sel!=null&&+k.dataset.d===N.sel);});}
function noteExplain(j){var N=NT,A=N.A,B=N.B,pl=(PLACE[j]||'')+'の位：';
  if(N.p.m==='add'){var a=A[j]||0,b=B[j]||0,c=N.c[j],s=a+b+c;
    if(j>=Math.max(A.length,B.length))return pl+'くり上がりの 1 がそのまま答えになるよ（せいかい '+N.p.ans+'）';
    return pl+a+'＋'+b+(c?'＋くり上がり1':'')+'＝'+s+(s>=10?' → '+(s%10)+' を書いて、1 は '+(PLACE[j+1]||'')+'の位へ':'')+'（せいかい '+N.p.ans+'）';}
  var top=A[j]-(N.lent[j]?1:0),bb=B[j]||0;
  if(N.lent[j]&&A[j]===0)top=9;
  return pl+(N.brw[j]?(top+' から '+bb+' はひけないので、'+(PLACE[j+1]||'')+'の位から 1 かりて '+(top+10)+'−'+bb+'＝'+(top+10-bb)):(top+'−'+bb+'＝'+(top-bb)))+'（せいかい '+N.p.ans+'）';}
function noteWrong(j,k,d,why){var N=NT;N.bad={j:j,k:k,d:d};N.why=why;locked=true;
  /* 正しい筆算をぜんぶ見せる */
  for(var i=0;i<N.R.length;i++){if(N.f[i]==null){N.f[i]=N.R[i];N.auto['f'+i]=1;}}N.t={};
  if(N.p.m==='sub')Object.keys(N.bv).forEach(function(x){if(N.bw[x]==null){N.bw[x]=N.bv[x];N.auto['b'+x]=1;}});
  noteRender();var a=document.getElementById('ngrid');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');}
function noteDrop(tgt,d){var N=NT;if(!N||N.done||N.bad||locked)return;var cur=noteCur(),k=tgt.charAt(0),j=+tgt.slice(1);
  if(k==='b'){ /* ひき算 くり下がり */
    if(N.bw[j]!=null)return;
    if(!N.lent[j])return noteWrong(j,'b',d,(PLACE[j]||'')+'の位は くり下がらないよ。'+noteExplain(cur>=0?cur:0));
    if(d!==N.bv[j])return noteWrong(j,'b',d,(PLACE[j]||'')+'の位は 1 かしたあと '+N.bv[j]+' になるよ。'+noteExplain(j-1));
    N.bw[j]=d;N.hist.push('b'+j);noteRender();return;}
  if(j===cur){
    if(d===N.R[j]){N.f[j]=d;delete N.t[j];N.hist.push('f'+j);
      /* ひき算：かりた位のしるしがまだなら 自動で書く */
      if(N.p.m==='sub'&&N.brw[j]){var q=j+1;while(N.lent[q]){if(N.bw[q]==null){N.bw[q]=N.bv[q];N.auto['b'+q]=1;}if(N.A[q]===0&&N.brw[q])q++;else break;}}
      var nc=noteCur();
      /* 正規化：残りが くり上がりだけの位で、仮の1が置いてあれば確定 */
      if(nc>=0&&N.p.m==='add'&&nc>=Math.max(N.A.length,N.B.length)&&N.t[nc]===N.R[nc]){N.f[nc]=N.R[nc];delete N.t[nc];N.hist.push('f'+nc);}
      if(noteCur()<0)return noteDone();
      noteRender();return;}
    if(N.p.m==='add'&&N.t[j]==null&&N.c[j]===1&&d===1){N.t[j]=1;N.hist.push('t'+j);noteRender();return;} /* 先に答えを運んでから くり上がりの1を置いたとき */
    return noteWrong(j,'f',d,noteExplain(j));}
  if(N.p.m==='add'&&cur>=0&&j===cur+1&&j<N.R.length&&N.f[j]==null){ /* くり上がり（仮） */
    if(N.t[j]!=null)return;
    if(N.c[j]===1&&d===1){N.t[j]=1;N.hist.push('t'+j);noteRender();return;}
    return noteWrong(j,'t',d,N.c[j]?noteExplain(cur):(PLACE[cur]||'')+'の位は くり上がらないよ。'+noteExplain(cur));}
  var m=document.getElementById('nmsg');m.textContent='いまは '+(PLACE[cur]||'')+'の位 だよ（右から じゅんばんに）';}
function noteDone(){var N=NT;N.done=true;locked=true;correct++;stats.today=(stats.today||0)+1;var _hq=histDay();_hq.q=Math.max((_hq.q||0)+1,stats.today);saveStats();
  noteRender();var g=document.getElementById('ngrid');g.classList.add('okflash');setTimeout(function(){g.classList.remove('okflash');nextProblem();},1100);}
function noteUndo(){var N=NT;if(!N||N.done||N.bad||!N.hist.length)return;var h=N.hist.pop(),k=h.charAt(0),j=+h.slice(1);
  if(k==='f'){delete N.f[j];}else if(k==='t'){delete N.t[j];}else{delete N.bw[j];}noteRender();}
function noteNext(){if(!NT||!NT.bad)return;nextProblem();}
function noteShow(){setupFromProblem();}
function setupFromProblem(){noteSetup(problems[pi]);noteRender();}
/* 数字キー：指でドラッグして運ぶ（タップ→マスをタップ でもOK） */
(function(){var G=null;
  function cells(){return Array.prototype.slice.call(document.querySelectorAll('#ngrid [data-drop]'));}
  function hit(x,y){var best=null,bd=1e9;cells().forEach(function(c){var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      var inside=x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6,d=Math.hypot(x-cx,y-cy);
      if(inside)d=0;if(d<bd&&d<Math.max(r.width,r.height)*0.9){bd=d;best=c;}});return best;}
  function mark(c){cells().forEach(function(x){x.classList.toggle('over',x===c);});}
  document.addEventListener('pointerdown',function(e){var k=e.target.closest&&e.target.closest('.nkey');if(!k||!NT||locked)return;e.preventDefault();
    var d=+k.dataset.d,gh=document.createElement('div');gh.className='nghost';gh.textContent=d;document.body.appendChild(gh);
    G={d:d,id:e.pointerId,x0:e.clientX,y0:e.clientY,gh:gh,mv:false};gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';});
  document.addEventListener('pointermove',function(e){if(!G||e.pointerId!==G.id)return;e.preventDefault();
    if(Math.hypot(e.clientX-G.x0,e.clientY-G.y0)>8)G.mv=true;G.gh.style.left=e.clientX+'px';G.gh.style.top=(e.clientY-34)+'px';G.gh.classList.toggle('on',G.mv);mark(G.mv?hit(e.clientX,e.clientY-34):null);},{passive:false});
  function end(e){if(!G||e.pointerId!==G.id)return;var g=G;G=null;g.gh.remove();mark(null);
    if(!g.mv){NT.sel=(NT.sel===g.d)?null:g.d;noteRender();return;}
    var c=hit(e.clientX,e.clientY-34);NT.sel=null;if(c)noteDrop(c.dataset.drop,g.d);else noteRender();}
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',function(e){if(G&&e.pointerId===G.id){G.gh.remove();G=null;mark(null);}});
  document.addEventListener('click',function(e){var c=e.target.closest&&e.target.closest('#ngrid [data-drop]');if(!c||!NT||NT.sel==null)return;var d=NT.sel;NT.sel=null;noteDrop(c.dataset.drop,d);});
  window.addEventListener('resize',function(){if(NT&&inMode==='note'&&!document.getElementById('play').hidden)noteRender();});
})();

renderHome();
</script>
